# Packaging configuration for the distribution `machina-sports-canonical`.
#
# THIS FILE PUBLISHES EXISTING BYTES. IT DOES NOT OWN THEM.
# The canonical runtime lives at `tools/iptc/canonical/` and is authoritative
# there. Nothing is moved, copied or rewritten to build this distribution: the
# import namespace `machina_sports_canonical` is mapped straight onto that
# directory by `package-dir`. `tests/test_iptc_canonical_package.py` hashes the
# installed files against `tools/iptc/vendored-manifest.json`, so a packaging step
# that transformed a source file would be a red test rather than a silent
# divergence between what this repository reviews and what a consumer runs.
#
# WHY IT IS PACKAGED AT ALL. `machina-client-api` execs a pyscript connector
# sidecar in-process, in the image's own interpreter. There is no per-template
# dependency install and no sys.path injection at execution time, so a connector
# can only `import machina_sports_canonical` if a wheel was installed into the
# image.
#
# ZERO DEPENDENCIES IS A CONTRACT, NOT AN ACCIDENT. The canonical core is standard
# library only and its floor is Python 3.9, because `sports-skills` vendors the
# same bytes as a published zero-dependency 3.9+ package. Adding a dependency here
# would fork that promise.

# TWO LICENSES, ONE ARCHIVE. The Machina-authored runtime, adapters and build
# tooling are MIT. Two packaged assets carry CC-BY-4.0 attribution obligations
# instead: `official-property-names.json` is extracted and generated from IPTC
# Sport Schema 1.1, and `shared-context.json` is Machina-authored but reproduces
# that work's pinned namespace bindings. `NOTICE-IPTC.md` carries the attribution
# and states the boundary. The expression below is a conjunction because both sets
# of terms apply to different members of the same archive; CC BY is never placed
# over the software.

# `setuptools>=77` rather than `>=68`, because that is the release that
# implements PEP 639 — the `license` expression string and `license-files` below
# are silently something else on an older backend.
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machina-sports-canonical"
version = "0.3.0"
description = "Canonical Machina Sports Schema runtime: provider-neutral observations, IPTC Sport Schema 1.1 serialization, and the shared JSON-LD context."
readme = "README-machina-sports-canonical.md"
requires-python = ">=3.9"
dependencies = []

# PEP 639: an SPDX expression and the files it names, and no legacy `License`
# field or `License ::` classifier beside them — two sources of truth for one
# decision is how an expression and a classifier come to disagree.
#
# Named one by one rather than as `LICENSES/*`: a glob would publish whatever
# appeared in that directory next, and what a distribution declares itself
# licensed under should be an explicit act.
license = "MIT AND CC-BY-4.0"
license-files = [
    "LICENSES/MIT.txt",
    "LICENSES/CC-BY-4.0.txt",
    "NOTICE-IPTC.md",
]

# The mapping that makes this a package without moving a file. Both packages are
# listed explicitly rather than discovered: auto-discovery over a repository root
# that also holds `tools/`, `tests/`, `scripts/` and `packaging/` would guess, and
# a guess is not something a release should depend on.
[tool.setuptools]
packages = ["machina_sports_canonical", "machina_sports_canonical.adapters"]
package-dir = {machina_sports_canonical = "tools/iptc/canonical"}
include-package-data = false

# The three non-Python files the runtime reads through `__file__`. Named one by
# one: a glob here would absorb whatever appeared beside them next, and what ships
# in a published package should be an explicit act.
[tool.setuptools.package-data]
machina_sports_canonical = [
    "official-property-names.json",
    "package-receipt.json",
    "shared-context.json",
    "data/capability_evidence_contract_v1.json",
    "data/coverage_derivation_manifest_v1.json",
    "data/identity_authority_registry_v1.json",
    "data/legacy_0_2_surface.json",
    "data/longitudinal_aggregation_manifest_v1.json",
    "data/official_statistic_admissibility_v1.json",
    "data/source_shape_registry_v1.json",
    "data/spatial_coordinate_system_manifest_v1.json",
    "data/spatial_distance_unit_registry_v1.json",
    "data/spatial_metric_manifest_v1.json",
    "data/spatial_transform_manifest_v1.json",
    "data/statistic_derivation_manifest_v1.json",
    "data/statistic_unit_registry_v1.json",
    "data/successor_provenance_schema_v1.json",
    "data/trusted_loader_manifest_v1.json",
    "data/zone_scheme_manifest_v1.json",
]

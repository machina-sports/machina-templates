workflow:

  # arquibancada-write-edition
  name: "arquibancada-write-edition"
  title: "Arquibancada - Write Edition"
  description: "Writes the copy of one magazine edition on this project's model allowance. The caller sends the editorial brief with the collected facts and gets the edition JSON back as text."
  inputs:
    brief: "$.get('brief')"
  outputs:
    copy: "$.get('copy', '')"
    workflow-status: "'executed' if $.get('copy') else 'failed'"
  tasks:

    - type: "prompt"
      name: "write-edition"
      description: "Write the edition copy from the brief."
      condition: "isinstance($.get('brief'), str) and len($.get('brief')) > 0"
      connector:
        name: "machina-ai"
        command: "invoke_prompt"
        provider: "vertex_ai"
        model: "gemini-3.8-flash"
        profile: "balanced"
        temperature: 0.5
        timeout: 120
      prompt:
        name: "arquibancada-write-edition-prompt"
      inputs:
        question: "$.get('brief')"
      outputs:
        copy: "$ if isinstance($, str) else ''"

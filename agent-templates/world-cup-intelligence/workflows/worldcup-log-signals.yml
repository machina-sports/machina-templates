workflow:
  name: worldcup-log-signals
  title: World Cup Intelligence - Log Signal Ledger
  description: |
    Append-only CLV ledger writer. For every model forecast with linked markets it
    recomputes the betting signal and logs one ledger row per value pick -- the entry
    price + model prob + edge + the source market needed to later capture the closing
    line. Insert-only (keyed by "{event_urn}:{outcome}"), so entry_price stays the FIRST
    time we flagged value. Closing-line capture + CLV scoring happen later in
    worldcup-backtest-forecasts once the fixture is final.

    Calibration sample (fatia 3): the same pass also logs one worldcup:calibration-sample
    row per 1X2 leg -- value pick or not -- with every source's probability, the posterior,
    the model and the best market price, so the resolved result can score each source
    without the value-pick selection bias. Signals are computed with the fusion weights
    learned so far (worldcup:calibration-report), and each row records the weights used.

  context-variables:
    debugger:
      enabled: true
  inputs:
    min_edge_bps: "$.get('min_edge_bps', 200)"
    competition: "$.get('competition', 'world-cup-2026')"
  outputs:
    logged_count: "len($.get('ledger_rows', []))"
    calibration_logged_count: "len($.get('calibration_rows', []))"
    workflow-status: "(len($.get('ledger_rows', [])) > 0 or len($.get('calibration_rows', [])) > 0) and 'executed' or 'skipped'"
  tasks:
    - type: document
      name: load-forecasts
      description: All model forecasts (one signal computed per event with markets).
      config:
        action: search
        search-limit: 500
        search-vector: false
      filters:
        name: "'worldcup:model-forecast'"
      outputs:
        forecasts: "[d.get('value', {}) for d in ($.get('documents', []) or [])]"

    - type: document
      name: load-markets
      description: Cached markets linked to events (for best-price line-shopping).
      config:
        action: search
        search-limit: 500
        search-vector: false
      filters:
        name: "'worldcup:market-cache'"
      outputs:
        markets: "[d.get('value', {}) for d in ($.get('documents', []) or [])]"

    - type: document
      name: load-existing-ledger
      description: Already-logged ledger ids (insert-only dedup).
      config:
        action: search
        search-limit: 2000
        search-vector: false
      filters:
        name: "'worldcup:signal-ledger'"
      outputs:
        existing_ids: "[d.get('value', {}).get('_id') for d in ($.get('documents', []) or []) if d.get('value', {}).get('_id')]"

    - type: document
      name: load-existing-calibration
      description: Already-logged calibration row ids (insert-only dedup).
      config:
        action: search
        search-limit: 5000
        search-vector: false
      filters:
        name: "'worldcup:calibration-sample'"
      outputs:
        existing_calibration_ids: "[d.get('value', {}).get('_id') for d in ($.get('documents', []) or []) if d.get('value', {}).get('_id')]"

    - type: document
      name: load-calibration-weights
      description: Fusion weights learned from settled signals; the v0 priors apply when no report exists yet.
      config:
        action: search
        search-limit: 1
        search-vector: false
      filters:
        name: "'worldcup:calibration-report'"
        metadata.event_urn: "'worldcup:calibration-report:aggregate'"
      outputs:
        calibration_weights: "((($.get('documents', []) or [{}])[0].get('value', {}) or {}).get('calibration', {}) or {}).get('weights_learned', {}) or {}"
        calibration_updated_at: "((($.get('documents', []) or [{}])[0].get('value', {}) or {}).get('calibration', {}) or {}).get('weights_updated_at', '') or ''"

    - type: connector
      name: build-ledger-rows
      description: Recompute signals; emit a ledger row per new value pick and a calibration row per new leg (insert-only).
      condition: "len($.get('forecasts', [])) > 0 and len($.get('markets', [])) > 0"
      connector:
        name: worldcup-market-intelligence
        command: build_signal_ledger_rows
      inputs:
        forecasts: "$.get('forecasts', [])"
        markets: "$.get('markets', [])"
        existing_ids: "$.get('existing_ids', [])"
        existing_calibration_ids: "$.get('existing_calibration_ids', [])"
        min_edge_bps: "$.get('min_edge_bps', 200)"
        competition: "$.get('competition', 'world-cup-2026')"
        # Only once the calibration loop has moved a weight (weights_updated_at set); see get-signal.
        source_weights: "$.get('calibration_weights', {}) if $.get('calibration_updated_at', '') else {}"
        weights_updated_at: "$.get('calibration_updated_at', '')"
      outputs:
        ledger_rows: "$.get('ledger_rows', [])"
        calibration_rows: "$.get('calibration_rows', [])"

    - type: document
      name: save-ledger
      description: Persist new signal-ledger rows (entries).
      condition: "len($.get('ledger_rows', [])) > 0"
      config:
        action: bulk-update
        embed-vector: false
        force-update: true
      document_name: "'worldcup:signal-ledger'"
      documents:
        items: "$.get('ledger_rows', [])"
      inputs:
        ledger_rows: "$.get('ledger_rows', [])"

    - type: document
      name: save-calibration-sample
      description: Persist new calibration rows (one per 1X2 leg; settled later by worldcup-backtest-forecasts).
      condition: "len($.get('calibration_rows', [])) > 0"
      config:
        action: bulk-update
        embed-vector: false
        force-update: true
      document_name: "'worldcup:calibration-sample'"
      documents:
        items: "$.get('calibration_rows', [])"
      inputs:
        calibration_rows: "$.get('calibration_rows', [])"

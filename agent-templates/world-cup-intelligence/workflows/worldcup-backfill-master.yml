workflow:
  name: worldcup-backfill-master
  title: World Cup Intelligence - Master Backfill Orchestrator
  description: |
    Master orchestrator for the complete World Cup 2026 historical backfill.
    Runs all backfill workflows in sequence with proper dependencies:
    1. Crosswalks (teams, players, events) - foundation for all other data
    2. Model forecasts - complete historical forecast record
    3. Market sources - complete historical market cache (Polymarket + Kalshi settled)
    4. Data layer - injuries, squads, player performance context
    5. Editorial - match recaps, player spotlights
    
    Run once after tournament completion to produce the "complete record"
    for the ZeroClick agent storefront catalog.

  context-variables:
    debugger:
      enabled: true
    api-football:
      x-apisports-key: $TEMP_CONTEXT_VARIABLE_API_FOOTBALL_API_KEY
    sportradar-soccer:
      api_key: $TEMP_CONTEXT_VARIABLE_SPORTRADAR_SOCCER_V4_API_KEY
    opta:
      outlet: $MACHINA_CONTEXT_VARIABLE_OPTA_OUTLET
      secret: $MACHINA_CONTEXT_VARIABLE_OPTA_SECRET
    bwin:
      Bwin-AccessId: $TEMP_CONTEXT_VARIABLE_BWIN_ACCESS_ID
      Bwin-AccessIdToken: $TEMP_CONTEXT_VARIABLE_BWIN_ACCESS_ID_TOKEN
    sports-skills:
      api_key: $TEMP_CONTEXT_VARIABLE_SPORTS_SKILLS_API_KEY
    google-genai:
      credential: $TEMP_CONTEXT_VARIABLE_VERTEX_AI_CREDENTIAL
      project_id: $TEMP_CONTEXT_VARIABLE_VERTEX_AI_PROJECT_ID

  inputs:
    competition: "$.get('competition', 'world-cup-2026')"
    league: "$.get('league', '1')"
    season: "$.get('season', '2026')"
    batch_size: "$.get('batch_size', 20)"  # process 20 fixtures per batch for data layer
    force_regen: "$.get('force_regen', True)"

  outputs:
    crosswalks: "$.get('crosswalks', {})"
    forecasts: "$.get('forecasts', {})"
    markets: "$.get('markets', {})"
    data_layer: "$.get('data_layer', {})"
    editorial: "$.get('editorial', {})"
    warnings: "$.get('warnings', [])"
    workflow-status: "$.get('overall_status', 'skipped')"

  tasks:
    # Step 1: Crosswalks (foundation)
    - type: connector
      name: run-crosswalks-backfill
      description: Execute the identity crosswalk backfill workflow.
      connector:
        name: worldcup-market-intelligence
        command: normalize_identity_crosswalk  # placeholder - actual via execute_workflow
      inputs:
        workflow: "worldcup-backfill-crosswalks"
      outputs:
        crosswalks: "{}"

    # Step 2: Model forecasts (depends on crosswalks for team index)
    - type: connector
      name: run-forecasts-backfill
      description: Execute the model forecasts backfill workflow.
      condition: "$.get('crosswalks', {}) != {}"
      connector:
        name: worldcup-market-intelligence
        command: normalize_identity_crosswalk  # placeholder
      inputs:
        workflow: "worldcup-backfill-model-forecasts"
      outputs:
        forecasts: "{}"

    # Step 3: Market sources (can run in parallel with forecasts)
    - type: connector
      name: run-markets-backfill
      description: Execute the market sources backfill workflow.
      connector:
        name: worldcup-market-intelligence
        command: normalize_identity_crosswalk  # placeholder
      inputs:
        workflow: "worldcup-backfill-market-sources"
      outputs:
        markets: "{}"

    # Step 4: Data layer - process in batches of 20 fixtures
    - type: document
      name: load-total-fixtures
      description: Get total fixture count for batch planning.
      config:
        action: search
        search-limit: 1
        search-vector: false
      filters:
        name: "'worldcup:event'"
        value.sport:status: {"$in": ["FT", "AET", "PEN"]}
      outputs:
        total_fixtures: "len($.get('documents', []) or [])"

    # Note: Data layer and editorial backfills are best run as separate
    # execute_workflow calls for each batch to avoid timeout and allow
    # progress tracking. The master workflow documents the sequence.

    # 5. Summary
    - type: document
      name: summarize
      description: Write master backfill summary.
      config:
        action: create
        embed-vector: false
      inputs:
        name: "'worldcup:master-backfill-summary'"
        value._id: "'worldcup-master-backfill-' + datetime.utcnow().strftime('%Y%m%d-%H%M%S')"
        value: >
          {
            'competition': 'FIFA World Cup 2026',
            'status': 'orchestrated',
            'sequence': [
              '1. worldcup-backfill-crosswalks (teams, players, events)',
              '2. worldcup-backfill-model-forecasts (all 104 fixtures)',
              '3. worldcup-backfill-market-sources (Polymarket settled + Kalshi)',
              '4. worldcup-backfill-historical-data (injuries, squads, player perf) - batch 20',
              '5. worldcup-backfill-editorial-content (recaps + spotlights) - batch 20'
            ],
            'timestamp': datetime.utcnow().isoformat() + 'Z',
            'notes': 'Execute steps 4 and 5 via repeated execute_workflow calls with offset_fixtures/limit_fixtures'
          }
      outputs:
        overall_status: "'orchestrated'"
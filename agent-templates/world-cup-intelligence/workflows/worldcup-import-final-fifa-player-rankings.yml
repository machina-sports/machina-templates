workflow:
  name: worldcup-import-final-fifa-player-rankings
  title: World Cup Intelligence - Import Final FIFA Player Power Rankings
  description: |
    Fetches, resolves, validates, and imports the immutable final FIFA World Cup
    2026 player Power Ranking snapshot. Missing ranked identities are created only
    from complete official FIFA detail before the ranking records are persisted.

  context-variables:
    debugger:
      enabled: true
  outputs:
    imported_count: "$.get('published_count', 0)"
    source_accounting: "$.get('source_accounting', {})"
    snapshot_manifest: "$.get('snapshot_manifest', {})"
    workflow-status: "'executed' if $.get('published_count', 0) == 230 else 'skipped'"
  tasks:
    - type: document
      name: load-player-crosswalk
      description: Load the persisted World Cup tournament player identities used for fail-closed canonical resolution.
      config:
        action: search
        search-limit: 5000
        search-vector: false
      filters:
        name: "'worldcup:identity-crosswalk'"
        value._id: {"$regex": "^urn:machina:sport:soccer:player:"}
        value.machina_competition_slug: "'world-cup-2026'"
      outputs:
        player_crosswalk: "[d.get('value', {}) for d in ($.get('documents', []) or [])]"

    - type: connector
      name: prepare-final-player-rankings
      description: Direct-fetch the official snapshot and player details, resolve all identities, and validate the complete publication before any write.
      connector:
        name: worldcup-market-intelligence
        command: import_final_fifa_player_power_rankings
      inputs:
        source_url: "'https://fdh-api.fifa.com/v1/powerranking/season/285023.json'"
        timeout_seconds: "10"
        players: "$.get('player_crosswalk', [])"
      outputs:
        final_ranking_documents: "$.get('documents', [])"
        identity_documents: "$.get('identity_documents', [])"
        published_count: "$.get('published_count', 0)"
        source_accounting: "$.get('source_accounting', {})"
        snapshot_manifest: "$.get('manifest', {})"

    - type: document
      name: upsert-missing-player-identities
      description: Persist safely minted FIFA player identities before any ranking record references them.
      condition: "$.get('published_count', 0) == 230 and len($.get('final_ranking_documents', [])) == 231 and len($.get('identity_documents', [])) > 0"
      config:
        action: bulk-update
        embed-vector: false
        force-update: true
      document_name: "'worldcup:identity-crosswalk'"
      documents:
        items: "$.get('identity_documents', [])"
      inputs:
        identity_documents: "$.get('identity_documents', [])"

    - type: document
      name: import-final-player-rankings
      description: Persist exactly 230 validated player rows plus their snapshot manifest in one bulk operation using FIFA-ID document ids and stable per-item metadata upsert keys.
      condition: "$.get('published_count', 0) == 230 and len($.get('final_ranking_documents', [])) == 231"
      config:
        action: bulk-update
        embed-vector: false
        force-update: true
      document_name: "'worldcup:final-fifa-player-power-ranking'"
      documents:
        items: "$.get('final_ranking_documents', [])"
      inputs:
        final_ranking_documents: "$.get('final_ranking_documents', [])"

workflow:
  name: worldcup-get-player-performance-context
  title: World Cup Intelligence - Player Performance Context
  description: Returns player-level performance context from provider fixture statistics and persisted verified final FIFA rankings, kept separate from Machina provisional signals. Caller-supplied official ranking overrides are not accepted.

  context-variables:
    debugger:
      enabled: true
    api-football:
      x-apisports-key: $TEMP_CONTEXT_VARIABLE_API_FOOTBALL_API_KEY
  inputs:
    event_urn: "$.get('event_urn', '')"
    fixture_id: "$.get('fixture_id', '')"
    provider_event_id: "$.get('provider_event_id', '')"
    event: "$.get('event', '')"
    opponent: "$.get('opponent', '')"
    date: "$.get('date', '')"
    player_urn: "$.get('player_urn', '')"
    player: "$.get('player', '')"
    team: "$.get('team', '')"
    player_id: "$.get('player_id', '')"
    team_id: "$.get('team_id', '')"
    official_fifa_power_ranking: "{}"
  outputs:
    player_performance_context: "$.get('player_performance_context', {}) or {'event': $.get('event_document', {}), 'player': {}, 'official_fifa_power_ranking': ($.get('resolved_official_fifa_power_ranking', {}) or {'status': 'pending', 'source': 'fifa.com', 'scores': {'attacking': None, 'creativity': None, 'defending': None, 'in_possession': None, 'defending_goal': None}}), 'machina_provisional_performance_signal': {'status': 'unavailable', 'source_quality': 'unavailable', 'confidence': 0.0, 'scores_0_10': {'attacking': None, 'creativity': None, 'defending': None, 'in_possession': None, 'defending_goal': None}, 'drivers': [], 'warnings': ['No normalized player data supplied.']}, 'context_and_evidence': {'fallback_path': [], 'citations': [], 'missing_info_flags': ($.get('normalize_warnings', []) or []), 'freshness': {'provider_stats_fetched': False, 'official_fifa_expected_lag_hours': 4}}}"
    status: "'available' if len($.get('normalized_players', [])) > 0 and ($.get('resolved_official_fifa_power_ranking', {}) or {}).get('status') in ('available', 'not_ranked', 'not_eligible') else ('partial' if len($.get('normalized_players', [])) > 0 or ($.get('resolved_official_fifa_power_ranking', {}) or {}).get('status') in ('available', 'not_ranked', 'not_eligible', 'unmatched') else 'unavailable')"
    warnings: "($.get('resolution_warnings', []) or []) + ($.get('player_resolution_warnings', []) or []) + ($.get('normalize_warnings', []) or []) + (((($.get('normalized_players', []) or [{}])[0].get('warnings', [])) or []) if len($.get('normalized_players', [])) > 0 else []) + {'available': [], 'not_ranked': ['Resolved tournament player is absent from the completed FIFA leaderboard.'], 'not_eligible': ['FIFA Power Ranking eligibility was not met based on proven minutes evidence.'], 'unmatched': ['Canonical tournament player identity could not be resolved.'], 'pending': ['Official FIFA Power Ranking final snapshot is unavailable.']}.get(($.get('resolved_official_fifa_power_ranking', {}) or {}).get('status'), ['Official FIFA Power Ranking is unavailable.'])"
    candidates: "$.get('fixture_candidates', [])"
    player_candidates: "$.get('player_candidates', [])"
    archive: >-
      {'mode': 'final_archive', 'competition': 'FIFA World Cup 2026',
       'competition_status': 'completed', 'live': False,
         'snapshot_as_of': (((($.get('resolved_official_fifa_power_ranking', {}) or {}).get('source_snapshot') or {}).get('messageTimeUtc')) or ($.get('resolved_official_fifa_power_ranking', {}) or {}).get('as_of') or $.get('event_snapshot_as_of')),
         'capability_status': ('complete' if len($.get('normalized_players', [])) > 0 and ($.get('resolved_official_fifa_power_ranking', {}) or {}).get('status') in ('available', 'not_ranked', 'not_eligible') else ('partial' if len($.get('normalized_players', [])) > 0 or ($.get('resolved_official_fifa_power_ranking', {}) or {}).get('status') in ('available', 'not_ranked', 'not_eligible', 'unmatched') else 'unavailable')),
         'provenance': ((['api-football'] if len($.get('normalized_players', [])) > 0 else []) + (['fifa.com'] if ($.get('resolved_official_fifa_power_ranking', {}) or {}).get('status') in ('available', 'not_ranked', 'not_eligible', 'unmatched') else [])),
         'missing_capabilities': ((['provider_player_statistics'] if len($.get('normalized_players', [])) == 0 else []) + (['canonical_player_identity'] if ($.get('resolved_official_fifa_power_ranking', {}) or {}).get('status') == 'unmatched' else []) + (['official_fifa_final_snapshot'] if ($.get('resolved_official_fifa_power_ranking', {}) or {}).get('status') == 'pending' else [])),
       'notes': ['Machina provisional scores remain separate from official FIFA Power Ranking fields.']}
    workflow-status: "$.get('player_performance_context', {}) != {} and 'executed' or 'skipped'"
  tasks:
    - type: document
      name: resolve-load-events
      description: Load archived events for exact-id or natural-language fixture resolution.
      config:
        action: search
        search-limit: 500
        search-vector: false
      filters:
        name: "'worldcup:event'"
      outputs:
        resolve_events: "$.get('documents', []) or []"

    - type: connector
      name: resolve-fixture
      description: Resolve exactly one archived fixture; ambiguous and unknown inputs fail closed.
      connector:
        name: worldcup-market-intelligence
        command: resolve_archived_fixture
      inputs:
        events: "$.get('resolve_events', [])"
        event_urn: "$.get('event_urn', '')"
        provider_event_id: "$.get('provider_event_id') or $.get('fixture_id', '')"
        event: "$.get('event', '')"
        team: "$.get('team', '')"
        opponent: "$.get('opponent', '')"
        date: "$.get('date', '')"
      outputs:
        event_document: "$.get('event', {})"
        event_urn: "$.get('event_urn', '')"
        resolved_fixture_id: "$.get('provider_event_id', '')"
        resolved_fixture: "$.get('resolved_fixture', {})"
        fixture_candidates: "$.get('candidates', [])"
        resolution_warnings: "$.get('warnings', [])"
        event_snapshot_as_of: "$.get('snapshot_as_of')"

    - type: document
      name: resolve-load-players
      description: Load persisted tournament players for explicit player identity resolution.
      condition: "$.get('player_urn', '') != '' or $.get('player', '') != ''"
      config:
        action: search
        search-limit: 2000
        search-vector: false
      filters:
        name: "'worldcup:identity-crosswalk'"
        value.machina_competition_slug: "'world-cup-2026'"
        "value.@type": "'sport:Player'"
      outputs:
        resolve_players: "[d.get('value', {}) for d in ($.get('documents', []) or [])]"

    - type: connector
      name: resolve-player
      description: Resolve one canonical player; ambiguous names fail closed.
      condition: "len($.get('resolve_players', [])) > 0"
      connector:
        name: worldcup-market-intelligence
        command: resolve_player
      inputs:
        players: "$.get('resolve_players', [])"
        player_urn: "$.get('player_urn', '')"
        player: "$.get('player', '')"
        team: "$.get('team', '')"
      outputs:
        resolved_player_identity: "$.get('player', {})"
        player_urn: "$.get('player', {}).get('player_urn', '')"
        resolved_player_id: "$.get('player', {}).get('provider_ids', {}).get('api_football')"
        resolved_team_id: "$.get('player', {}).get('team_urn', '')"
        player_candidates: "$.get('candidates', [])"
        player_resolution_warnings: "$.get('warnings', [])"

    - type: connector
      name: fetch-player-stats-af
      description: Provider-backed player statistics for the resolved fixture; optional player_id/team_id filters narrow the result.
      condition: "$.get('resolved_fixture_id') not in (None, '') and ($.get('resolved_player_id') or $.get('player_id')) not in (None, '')"
      continue_on_error: true
      connector:
        name: api-football
        command: get-fixtures/players
      inputs:
        fixture: "$.get('resolved_fixture_id')"
        player: "$.get('resolved_player_id') or ($.get('player_id') if $.get('player_id') else None)"
        team: "$.get('team_id') if $.get('team_id') else None"
      outputs:
        api_football_player_stats: "$"

    - type: connector
      name: normalize-player-match-stats
      description: Normalize provider player statistics into the World Cup Intelligence player context schema.
      connector:
        name: worldcup-market-intelligence
        command: normalize_player_match_stats
      inputs:
        event_urn: "$.get('event_urn') or $.get('fixture_id')"
        fixture_id: "$.get('resolved_fixture_id')"
        player_id: "$.get('resolved_player_id') or $.get('player_id')"
        team_id: "$.get('team_id')"
        player_stats: "$.get('api_football_player_stats', {})"
      outputs:
        normalized_players: "$.get('players', [])"
        normalized_player_count: "$.get('count', 0)"
        normalize_warnings: "$.get('warnings', [])"
        selected_player: "($.get('players', []) or [{}])[0] if len($.get('players', [])) == 1 else {}"

    - type: connector
      name: score-provisional-performance
      description: Calculate the Machina provisional 0-10 signal for the selected player. This is not an official FIFA/Aramco Power Ranking.
      condition: "len($.get('normalized_players', [])) > 0"
      connector:
        name: worldcup-market-intelligence
        command: score_provisional_player_performance
      inputs:
        player: "$.get('selected_player', {})"
      outputs:
        machina_provisional_performance_signal: "$.get('machina_provisional_performance_signal', {})"

    - type: document
      name: load-player-identity
      description: Resolve the canonical player URN/name from the persisted tournament squad crosswalk.
      condition: "len($.get('normalized_players', [])) > 0"
      config:
        action: search
        search-limit: 1
        search-vector: false
      filters:
        name: "'worldcup:identity-crosswalk'"
        value.provider_ids.api_football: "$.get('selected_player', {}).get('player_id')"
        value.machina_competition_slug: "'world-cup-2026'"
      outputs:
        player_identity: "($.get('documents', []) or [{}])[0].get('value', {})"

    - type: document
      name: load-final-fifa-player-rankings
      description: Load persisted verified final FIFA player Power Ranking records for canonical matching.
      config:
        action: search
        search-limit: 500
        search-vector: false
      filters:
        name: "'worldcup:final-fifa-player-power-ranking'"
      outputs:
        final_fifa_player_rankings: "[d.get('value', {}) for d in ($.get('documents', []) or []) if d.get('value', {}).get('record_type') == 'player_power_ranking']"
        final_fifa_player_ranking_manifest: "([d.get('value', {}) for d in ($.get('documents', []) or []) if d.get('value', {}).get('record_type') == 'snapshot_manifest'] or [{}])[0]"

    - type: connector
      name: select-official-fifa-player-ranking
      description: Match a persisted verified final record; never promote caller-provided rankings to official FIFA evidence.
      connector:
        name: worldcup-market-intelligence
        command: select_official_player_power_ranking
      inputs:
        override: "{}"
        records: "$.get('final_fifa_player_rankings', [])"
        snapshot_manifest: "$.get('final_fifa_player_ranking_manifest', {})"
        player_urn: "$.get('player_identity', {}).get('_id', '')"
        player_name: "$.get('player_identity', {}).get('name') or ($.get('normalized_players', []) or [{}])[0].get('name', '')"
        identity_resolved: "$.get('player_identity', {}) != {}"
        tournament_player: "$.get('player_identity', {}).get('machina_competition_slug') == 'world-cup-2026'"
        trusted_minutes_evidence: "$.get('player_identity', {}).get('tournament_minutes_evidence', {})"
      outputs:
        resolved_official_fifa_power_ranking: "$.get('official_fifa_power_ranking', {})"

    - type: connector
      name: merge-player-performance-context
      description: Return the final API package with official FIFA fields and Machina provisional fields labeled separately.
      condition: "len($.get('normalized_players', [])) > 0"
      connector:
        name: worldcup-market-intelligence
        command: merge_official_and_provisional_performance
      inputs:
        event: "$.get('event_document', {})"
        player: "$.get('selected_player', {})"
        provisional_signal: "$.get('machina_provisional_performance_signal', {})"
        official_fifa_power_ranking: "$.get('resolved_official_fifa_power_ranking', {})"
        fallback_path: "['api-football']"
        missing_info_flags: "$.get('normalize_warnings', [])"
        freshness: "{'provider_stats_fetched': $.get('api_football_player_stats', {}) != {}, 'official_fifa_expected_lag_hours': 4}"
      outputs:
        player_performance_context: "$.get('player_performance_context', {})"

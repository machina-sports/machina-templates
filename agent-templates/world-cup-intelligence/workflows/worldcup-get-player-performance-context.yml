workflow:
  name: worldcup-get-player-performance-context
  title: World Cup Intelligence - Player Performance Context
  description: Returns player-level performance context from provider fixture statistics and persisted verified final FIFA rankings, kept separate from Machina provisional signals. Caller-supplied official ranking overrides are not accepted.

  context-variables:
    debugger:
      enabled: true
    api-football:
      x-apisports-key: $TEMP_CONTEXT_VARIABLE_API_FOOTBALL_API_KEY
  inputs:
    event_urn: "$.get('event_urn', '')"
    fixture_id: "$.get('fixture_id', '')"
    provider_event_id: "$.get('provider_event_id', '')"
    event: "$.get('event', '')"
    opponent: "$.get('opponent', '')"
    date: "$.get('date', '')"
    player_urn: "$.get('player_urn', '')"
    player: "$.get('player', '')"
    team: "$.get('team', '')"
    player_id: "$.get('player_id', '')"
    team_id: "$.get('team_id', '')"
    official_fifa_power_ranking: "{}"
  outputs:
    player_performance_context: "$.get('archive_response', {}).get('player_performance_context') if $.get('archive_hit', False) else ($.get('player_performance_context', {}) or {'event': $.get('event_document', {}), 'player': {}, 'official_fifa_power_ranking': ($.get('resolved_official_fifa_power_ranking', {}) or {'status': 'pending', 'source': 'fifa.com', 'scores': {'attacking': None, 'creativity': None, 'defending': None, 'in_possession': None, 'defending_goal': None}}), 'machina_provisional_performance_signal': {'status': 'unavailable', 'source_quality': 'unavailable', 'confidence': 0.0, 'scores_0_10': {'attacking': None, 'creativity': None, 'defending': None, 'in_possession': None, 'defending_goal': None}, 'drivers': [], 'warnings': ['No normalized player data supplied.']}, 'context_and_evidence': {'fallback_path': [], 'citations': [], 'missing_info_flags': ($.get('normalize_warnings', []) or []), 'freshness': {'provider_stats_fetched': False, 'official_fifa_expected_lag_hours': 4}}})"
    status: "$.get('archive_response', {}).get('status') if $.get('archive_hit', False) else ('available' if len($.get('normalized_players', [])) > 0 and ($.get('resolved_official_fifa_power_ranking', {}) or {}).get('status') in ('available', 'not_ranked', 'not_eligible') else ('partial' if len($.get('normalized_players', [])) > 0 or ($.get('resolved_official_fifa_power_ranking', {}) or {}).get('status') in ('available', 'not_ranked', 'not_eligible', 'unmatched') else 'unavailable'))"
    warnings: "$.get('archive_response', {}).get('warnings', []) if $.get('archive_status', 'miss') != 'miss' else (($.get('resolution_warnings', []) or []) + ($.get('player_resolution_warnings', []) or []) + ($.get('normalize_warnings', []) or []) + (((($.get('normalized_players', []) or [{}])[0].get('warnings', [])) or []) if len($.get('normalized_players', [])) > 0 else []) + {'available': [], 'not_ranked': ['Resolved tournament player is absent from the completed FIFA leaderboard.'], 'not_eligible': ['FIFA Power Ranking eligibility was not met based on proven minutes evidence.'], 'unmatched': ['Canonical tournament player identity could not be resolved.'], 'pending': ['Official FIFA Power Ranking final snapshot is unavailable.']}.get(($.get('resolved_official_fifa_power_ranking', {}) or {}).get('status'), ['Official FIFA Power Ranking is unavailable.']))"
    candidates: "$.get('archive_response', {}).get('candidates') if $.get('archive_hit', False) else ($.get('fixture_candidates', []))"
    player_candidates: "$.get('archive_response', {}).get('player_candidates') if $.get('archive_hit', False) else ($.get('player_candidates', []))"
    archive: >-
      $.get('archive_metadata', {}) if $.get('archive_status', 'miss') != 'miss' else ({'mode': 'final_archive', 'competition': 'FIFA World Cup 2026',
       'competition_status': 'completed', 'live': False,
         'snapshot_as_of': (((($.get('resolved_official_fifa_power_ranking', {}) or {}).get('source_snapshot') or {}).get('messageTimeUtc')) or ($.get('resolved_official_fifa_power_ranking', {}) or {}).get('as_of') or $.get('event_snapshot_as_of')),
         'capability_status': ('complete' if len($.get('normalized_players', [])) > 0 and ($.get('resolved_official_fifa_power_ranking', {}) or {}).get('status') in ('available', 'not_ranked', 'not_eligible') else ('partial' if len($.get('normalized_players', [])) > 0 or ($.get('resolved_official_fifa_power_ranking', {}) or {}).get('status') in ('available', 'not_ranked', 'not_eligible', 'unmatched') else 'unavailable')),
         'provenance': ((['api-football'] if len($.get('normalized_players', [])) > 0 else []) + (['fifa.com'] if ($.get('resolved_official_fifa_power_ranking', {}) or {}).get('status') in ('available', 'not_ranked', 'not_eligible', 'unmatched') else [])),
         'missing_capabilities': ((['provider_player_statistics'] if len($.get('normalized_players', [])) == 0 else []) + (['canonical_player_identity'] if ($.get('resolved_official_fifa_power_ranking', {}) or {}).get('status') == 'unmatched' else []) + (['official_fifa_final_snapshot'] if ($.get('resolved_official_fifa_power_ranking', {}) or {}).get('status') == 'pending' else [])),
       'notes': ['Machina provisional scores remain separate from official FIFA Power Ranking fields.']})
    workflow-status: "'executed' if $.get('archive_hit', False) else ('skipped' if $.get('archive_status') in ('error', 'unavailable') else ($.get('player_performance_context', {}) != {} and 'executed' or 'skipped'))"
  tasks:
    - type: document
      name: load-final-archive-manifest
      config:
        action: search
        search-limit: 2
        search-vector: false
      filters:
        name: "'worldcup:final-archive-manifest'"
        value.archive_version: "'world-cup-2026-final-v2'"
      outputs:
        archive_manifest_documents: $.get('documents', []) or []
    - type: document
      name: load-final-archive-scope-events
      config:
        action: search
        search-limit: 500
        search-vector: false
      filters:
        name: "'worldcup:event'"
        value.machina_competition_slug: "'world-cup-2026'"
      outputs:
        archive_scope_events: $.get('documents', []) or []
    - type: connector
      name: resolve-final-archive-scope
      connector:
        name: worldcup-market-intelligence
        command: resolve_archived_fixture
      inputs:
        events: $.get('archive_scope_events', [])
        event_urn: $.get('event_urn', '')
        provider_event_id: $.get('provider_event_id') or $.get('fixture_id', '')
        event: $.get('event', '')
        team: $.get('team', '')
        opponent: $.get('opponent', '')
        date: $.get('date', '')
      outputs:
        archive_resolved_event_urn: $.get('event_urn', '')
    - type: document
      name: load-final-archive
      description: Load immutable endpoint rows in a stable order before legacy execution.
      config:
        action: search
        search-limit: 10
        search-vector: false
        search-sorters:
          - _id
          - 1
      filters:
        name: "'worldcup:final-archive'"
        value.archive_version: "'world-cup-2026-final-v2'"
        value.endpoint: "'worldcup-get-player-performance-context'"
        value.subject.event_urn: $.get('archive_resolved_event_urn', '')
      outputs:
        archive_documents: $.get('documents', []) or []
        archive_search_limit_reached: len($.get('documents', []) or []) >= 10
        archive_has_fixture_player_pack: "len([d for d in ($.get('documents', []) or []) if isinstance(d.get('value', {}).get('response', {}).get('fixture_player_pack'), dict)]) > 0"
    - type: document
      name: load-final-archive-events
      description: Load the complete canonical tournament index used to resolve archive selectors.
      config:
        action: search
        search-limit: 500
        search-vector: false
        search-sorters:
          - _id
          - 1
      filters:
        name: "'worldcup:event'"
        value.machina_competition_slug: "'world-cup-2026'"
      outputs:
        archive_canonical_events: $.get('documents', []) or []
        archive_canonical_events_search_limit_reached: len($.get('documents', []) or []) >= 500
    - type: document
      name: load-final-archive-identities
      description: Load the complete canonical tournament index used to resolve archive selectors.
      condition: "not $.get('archive_has_fixture_player_pack', False)"
      config:
        action: search
        search-limit: 5000
        search-vector: false
        search-sorters:
          - _id
          - 1
      filters:
        name: "'worldcup:identity-crosswalk'"
        value.machina_competition_slug: "'world-cup-2026'"
      outputs:
        archive_canonical_identities: $.get('documents', []) or []
        archive_canonical_identities_search_limit_reached: len($.get('documents', []) or []) >= 5000
    - type: connector
      name: serve-final-archive
      description: Validate and serve an exact archive hit; clean misses alone may continue to legacy tasks.
      connector:
        name: worldcup-market-intelligence
        command: serve_final_archive
      inputs:
        endpoint: "'worldcup-get-player-performance-context'"
        archive_version: "'world-cup-2026-final-v2'"
        request: "{'event_urn': $.get('event_urn', ''), 'fixture_id': $.get('fixture_id', ''), 'provider_event_id': $.get('provider_event_id', ''), 'event': $.get('event', ''), 'opponent': $.get('opponent', ''), 'date': $.get('date', ''), 'player_urn': $.get('player_urn', ''), 'player': $.get('player', ''), 'team': $.get('team', ''), 'player_id': $.get('player_id', ''), 'team_id': $.get('team_id', '')}"
        documents: $.get('archive_documents', [])
        archive_search_limit_reached: $.get('archive_search_limit_reached', False)
        canonical_events: $.get('archive_canonical_events', [])
        event_search_limit_reached: $.get('archive_canonical_events_search_limit_reached', False)
        canonical_identities: $.get('archive_canonical_identities', [])
        identity_search_limit_reached: $.get('archive_canonical_identities_search_limit_reached', False)
        archive_manifest: $.get('archive_manifest_documents', [])
      outputs:
        archive_hit: $.get('archive_hit', False)
        archive_status: $.get('archive_status', 'error')
        archive_response: $.get('response', {})
        archive_metadata: $.get('archive', {})
    - type: document
      name: resolve-load-events
      description: Load archived events for exact-id or natural-language fixture resolution.
      config:
        action: search
        search-limit: 500
        search-vector: false
      filters:
        name: "'worldcup:event'"
      outputs:
        resolve_events: "$.get('documents', []) or []"

      condition: $.get('archive_status', 'miss') == 'miss'
    - type: connector
      name: resolve-fixture
      description: Resolve exactly one archived fixture; ambiguous and unknown inputs fail closed.
      connector:
        name: worldcup-market-intelligence
        command: resolve_archived_fixture
      inputs:
        events: "$.get('resolve_events', [])"
        event_urn: "$.get('event_urn', '')"
        provider_event_id: "$.get('provider_event_id') or $.get('fixture_id', '')"
        event: "$.get('event', '')"
        team: "$.get('team', '')"
        opponent: "$.get('opponent', '')"
        date: "$.get('date', '')"
      outputs:
        event_document: "$.get('event', {})"
        event_urn: "$.get('event_urn', '')"
        resolved_fixture_id: "$.get('provider_event_id', '')"
        resolved_fixture: "$.get('resolved_fixture', {})"
        fixture_candidates: "$.get('candidates', [])"
        resolution_warnings: "$.get('warnings', [])"
        event_snapshot_as_of: "$.get('snapshot_as_of')"

      condition: $.get('archive_status', 'miss') == 'miss'
    - type: document
      name: resolve-load-players
      description: Load persisted tournament players for explicit player identity resolution.
      condition: "$.get('archive_status', 'miss') == 'miss' and ($.get('player_urn', '') != '' or $.get('player', '') != '')"
      config:
        action: search
        search-limit: 2000
        search-vector: false
      filters:
        name: "'worldcup:identity-crosswalk'"
        value.machina_competition_slug: "'world-cup-2026'"
        "value.@type": "'sport:Player'"
      outputs:
        resolve_players: "[d.get('value', {}) for d in ($.get('documents', []) or [])]"

    - type: connector
      name: resolve-player
      description: Resolve one canonical player; ambiguous names fail closed.
      condition: "$.get('archive_status', 'miss') == 'miss' and len($.get('resolve_players', [])) > 0"
      connector:
        name: worldcup-market-intelligence
        command: resolve_player
      inputs:
        players: "$.get('resolve_players', [])"
        player_urn: "$.get('player_urn', '')"
        player: "$.get('player', '')"
        team: "$.get('team', '')"
      outputs:
        resolved_player_identity: "$.get('player', {})"
        player_urn: "$.get('player', {}).get('player_urn', '')"
        resolved_player_id: "$.get('player', {}).get('provider_ids', {}).get('api_football')"
        resolved_team_id: "$.get('player', {}).get('team_urn', '')"
        player_candidates: "$.get('candidates', [])"
        player_resolution_warnings: "$.get('warnings', [])"

    - type: connector
      name: fetch-player-stats-af
      description: Provider-backed player statistics for the resolved fixture; optional player_id/team_id filters narrow the result.
      condition: "$.get('archive_status', 'miss') == 'miss' and ($.get('resolved_fixture_id') not in (None, '') and ($.get('resolved_player_id') or $.get('player_id')) not in (None, ''))"
      continue_on_error: true
      connector:
        name: api-football
        command: get-fixtures/players
      inputs:
        fixture: "$.get('resolved_fixture_id')"
        player: "$.get('resolved_player_id') or ($.get('player_id') if $.get('player_id') else None)"
        team: "$.get('team_id') if $.get('team_id') else None"
      outputs:
        api_football_player_stats: "$"

    - type: connector
      name: normalize-player-match-stats
      description: Normalize provider player statistics into the World Cup Intelligence player context schema.
      connector:
        name: worldcup-market-intelligence
        command: normalize_player_match_stats
      inputs:
        event_urn: "$.get('event_urn') or $.get('fixture_id')"
        fixture_id: "$.get('resolved_fixture_id')"
        player_id: "$.get('resolved_player_id') or $.get('player_id')"
        team_id: "$.get('team_id')"
        player_stats: "$.get('api_football_player_stats', {})"
      outputs:
        normalized_players: "$.get('players', [])"
        normalized_player_count: "$.get('count', 0)"
        normalize_warnings: "$.get('warnings', [])"
        selected_player: "($.get('players', []) or [{}])[0] if len($.get('players', [])) == 1 else {}"

      condition: $.get('archive_status', 'miss') == 'miss'
    - type: connector
      name: score-provisional-performance
      description: Calculate the Machina provisional 0-10 signal for the selected player. This is not an official FIFA/Aramco Power Ranking.
      condition: "$.get('archive_status', 'miss') == 'miss' and (len($.get('normalized_players', [])) > 0)"
      connector:
        name: worldcup-market-intelligence
        command: score_provisional_player_performance
      inputs:
        player: "$.get('selected_player', {})"
      outputs:
        machina_provisional_performance_signal: "$.get('machina_provisional_performance_signal', {})"

    - type: document
      name: load-player-identity
      description: Resolve the canonical player URN/name from the persisted tournament squad crosswalk.
      condition: "$.get('archive_status', 'miss') == 'miss' and (len($.get('normalized_players', [])) > 0)"
      config:
        action: search
        search-limit: 1
        search-vector: false
      filters:
        name: "'worldcup:identity-crosswalk'"
        value.provider_ids.api_football: "$.get('selected_player', {}).get('player_id')"
        value.machina_competition_slug: "'world-cup-2026'"
      outputs:
        player_identity: "($.get('documents', []) or [{}])[0].get('value', {})"

    - type: document
      name: load-final-fifa-player-rankings
      description: Load persisted verified final FIFA player Power Ranking records for canonical matching.
      config:
        action: search
        search-limit: 500
        search-vector: false
      filters:
        name: "'worldcup:final-fifa-player-power-ranking'"
      outputs:
        final_fifa_player_rankings: "[d.get('value', {}) for d in ($.get('documents', []) or []) if d.get('value', {}).get('record_type') == 'player_power_ranking']"
        final_fifa_player_ranking_manifest: "([d.get('value', {}) for d in ($.get('documents', []) or []) if d.get('value', {}).get('record_type') == 'snapshot_manifest'] or [{}])[0]"

      condition: $.get('archive_status', 'miss') == 'miss'
    - type: connector
      name: select-official-fifa-player-ranking
      description: Match a persisted verified final record; never promote caller-provided rankings to official FIFA evidence.
      connector:
        name: worldcup-market-intelligence
        command: select_official_player_power_ranking
      inputs:
        override: "{}"
        records: "$.get('final_fifa_player_rankings', [])"
        snapshot_manifest: "$.get('final_fifa_player_ranking_manifest', {})"
        player_urn: "$.get('player_identity', {}).get('_id', '')"
        player_name: "$.get('player_identity', {}).get('name') or ($.get('normalized_players', []) or [{}])[0].get('name', '')"
        identity_resolved: "$.get('player_identity', {}) != {}"
        tournament_player: "$.get('player_identity', {}).get('machina_competition_slug') == 'world-cup-2026'"
        trusted_minutes_evidence: "$.get('player_identity', {}).get('tournament_minutes_evidence', {})"
      outputs:
        resolved_official_fifa_power_ranking: "$.get('official_fifa_power_ranking', {})"

      condition: $.get('archive_status', 'miss') == 'miss'
    - type: connector
      name: merge-player-performance-context
      description: Return the final API package with official FIFA fields and Machina provisional fields labeled separately.
      condition: "$.get('archive_status', 'miss') == 'miss' and (len($.get('normalized_players', [])) > 0)"
      connector:
        name: worldcup-market-intelligence
        command: merge_official_and_provisional_performance
      inputs:
        event: "$.get('event_document', {})"
        player: "$.get('selected_player', {})"
        provisional_signal: "$.get('machina_provisional_performance_signal', {})"
        official_fifa_power_ranking: "$.get('resolved_official_fifa_power_ranking', {})"
        fallback_path: "['api-football']"
        missing_info_flags: "$.get('normalize_warnings', [])"
        freshness: "{'provider_stats_fetched': $.get('api_football_player_stats', {}) != {}, 'official_fifa_expected_lag_hours': 4}"
      outputs:
        player_performance_context: "$.get('player_performance_context', {})"

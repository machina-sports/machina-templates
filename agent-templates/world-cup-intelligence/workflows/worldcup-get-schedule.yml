workflow:
  name: worldcup-get-schedule
  title: World Cup Intelligence - Schedule
  description: List World Cup fixtures from the normalized event cache (IPTC), filtered by date range, team, or status. Serves our own derived event data from same-pod state — not a raw upstream proxy.

  context-variables:
    debugger:
      enabled: true
  inputs:
    date_from: "$.get('date_from', '')"
    date_to: "$.get('date_to', '')"
    team: "$.get('team', '')"
    opponent: "$.get('opponent', '')"
    status: "$.get('status', '')"
    limit: "$.get('limit', 104)"
    offset: "$.get('offset', 0)"
  outputs:
    coverage: "$.get('archive_response', {}).get('coverage', {'schema_version': 'worldcup-storefront-coverage-v1', 'status': 'partial', 'reason': 'Legacy v2 compatibility response; exact coverage was not recorded.', 'scope': 'completed_tournament_archive', 'mode': 'historical', 'source_provenance': $.get('archive_metadata', {}).get('provenance', []), 'population_count': None, 'eligible_count': None, 'included_count': None, 'excluded_count': None, 'exclusion_reasons': {}, 'unsupported_fields': $.get('archive_metadata', {}).get('missing_capabilities', [])})"
    schedule: "$.get('archive_response', {}).get('schedule') if $.get('archive_hit', False) else ($.get('schedule', {}))"
    warnings: "$.get('archive_response', {}).get('warnings', []) if $.get('archive_status', 'miss') != 'miss' else ($.get('schedule', {}).get('warnings', []))"
    archive: >-
      $.get('archive_metadata', {}) if $.get('archive_status', 'miss') != 'miss' else ({'mode': 'final_archive', 'competition': 'FIFA World Cup 2026',
       'competition_status': 'completed', 'live': False,
       'snapshot_as_of': $.get('schedule_snapshot_as_of'),
       'capability_status': 'complete' if $.get('schedule', {}).get('events') else 'unavailable',
       'provenance': ['worldcup:event'] if $.get('schedule', {}).get('events') else [],
       'missing_capabilities': [] if $.get('schedule', {}).get('events') else ['schedule'],
       'notes': ['Archived fixtures and final results from the normalized event cache.']})
    workflow-status: "'executed' if $.get('archive_hit', False) else ('skipped' if $.get('archive_status') == 'error' else ($.get('schedule', {}).get('events') is not None and 'executed' or 'skipped'))"
  tasks:
    - type: document
      name: load-final-archive-manifest
      config:
        action: search
        search-limit: 2
        search-vector: false
      filters:
        name: "'worldcup:final-archive-manifest'"
        value.archive_version: "'world-cup-2026-final-v3'"
      outputs:
        archive_manifest_documents: $.get('documents', []) or []
    - type: document
      name: load-final-archive
      description: Load immutable endpoint rows in a stable order before legacy execution.
      config:
        action: search
        search-limit: 5000
        search-vector: false
        search-sorters:
          - _id
          - 1
      filters:
        name: "'worldcup:final-archive'"
        value.archive_version: "'world-cup-2026-final-v3'"
        value.endpoint: "'worldcup-get-schedule'"
      outputs:
        archive_documents: $.get('documents', []) or []
        archive_search_limit_reached: len($.get('documents', []) or []) >= 5000
    - type: document
      name: load-final-archive-events
      description: Load the complete canonical tournament index used to resolve archive selectors.
      config:
        action: search
        search-limit: 500
        search-vector: false
        search-sorters:
          - _id
          - 1
      filters:
        name: "'worldcup:event'"
        value.machina_competition_slug: "'world-cup-2026'"
      outputs:
        archive_canonical_events: $.get('documents', []) or []
        archive_canonical_events_search_limit_reached: len($.get('documents', []) or []) >= 500
    - type: connector
      name: serve-final-archive
      description: Validate and serve an exact archive hit; clean misses alone may continue to legacy tasks.
      connector:
        name: worldcup-market-intelligence
        command: serve_final_archive
      inputs:
        endpoint: "'worldcup-get-schedule'"
        archive_version: "'world-cup-2026-final-v3'"
        request: "{'date_from': $.get('date_from', ''), 'date_to': $.get('date_to', ''), 'team': $.get('team', ''), 'opponent': $.get('opponent', ''), 'status': $.get('status', ''), 'limit': $.get('limit', 104), 'offset': $.get('offset', 0)}"
        documents: $.get('archive_documents', [])
        archive_search_limit_reached: $.get('archive_search_limit_reached', False)
        canonical_events: $.get('archive_canonical_events', [])
        event_search_limit_reached: $.get('archive_canonical_events_search_limit_reached', False)
        canonical_identities: $.get('archive_canonical_identities', [])
        identity_search_limit_reached: $.get('archive_canonical_identities_search_limit_reached', False)
        archive_manifest: $.get('archive_manifest_documents', [])
      outputs:
        archive_hit: $.get('archive_hit', False)
        archive_status: $.get('archive_status', 'error')
        archive_response: $.get('response', {})
        archive_metadata: $.get('archive', {})
    - type: document
      name: load-events
      description: Load cached World Cup events from same-pod document state.
      config:
        action: search
        search-limit: 500
        search-vector: false
      filters:
        name: "'worldcup:event'"
      outputs:
        events: "[d.get('value', {}) for d in ($.get('documents', []) or [])]"
        schedule_snapshot_as_of: "max([str(d.get('value', {}).get('updated_at') or d.get('value', {}).get('fetched_at') or d.get('updated') or d.get('created')) for d in ($.get('documents', []) or []) if d.get('value', {}).get('updated_at') or d.get('value', {}).get('fetched_at') or d.get('updated') or d.get('created')], default=None)"

      condition: $.get('archive_status', 'miss') == 'miss'
    - type: connector
      name: normalize-schedule
      description: Shape and filter cached events into a fixture-list view.
      connector:
        name: worldcup-market-intelligence
        command: normalize_schedule
      inputs:
        events: "$.get('events', [])"
        date_from: "$.get('date_from', '')"
        date_to: "$.get('date_to', '')"
        team: "$.get('team', '')"
        opponent: "$.get('opponent', '')"
        status: "$.get('status', '')"
        limit: "$.get('limit', 104)"
        offset: "$.get('offset', 0)"
      outputs:
        # runner strips our connector's {status,data} envelope -> $ is the data.
        schedule: "$"
      condition: $.get('archive_status', 'miss') == 'miss'

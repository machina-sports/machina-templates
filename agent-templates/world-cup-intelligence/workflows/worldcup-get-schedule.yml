workflow:
  name: worldcup-get-schedule
  title: World Cup Intelligence - Schedule
  description: List World Cup fixtures from the normalized event cache (IPTC), filtered by date range, team, or status. Serves our own derived event data from same-pod state — not a raw upstream proxy.

  context-variables:
    debugger:
      enabled: true
  inputs:
    date_from: "$.get('date_from', '')"
    date_to: "$.get('date_to', '')"
    team: "$.get('team', '')"
    opponent: "$.get('opponent', '')"
    status: "$.get('status', '')"
    limit: "$.get('limit', 100)"
  outputs:
    schedule: "$.get('schedule', {})"
    archive: >-
      {'mode': 'final_archive', 'competition': 'FIFA World Cup 2026',
       'competition_status': 'completed', 'live': False,
       'snapshot_as_of': $.get('schedule_snapshot_as_of'),
       'capability_status': 'complete' if $.get('schedule', {}).get('events') else 'unavailable',
       'provenance': ['worldcup:event'] if $.get('schedule', {}).get('events') else [],
       'missing_capabilities': [] if $.get('schedule', {}).get('events') else ['schedule'],
       'notes': ['Archived fixtures and final results from the normalized event cache.']}
    workflow-status: "$.get('schedule', {}).get('events') is not None and 'executed' or 'skipped'"
  tasks:
    - type: document
      name: load-events
      description: Load cached World Cup events from same-pod document state.
      config:
        action: search
        search-limit: 500
        search-vector: false
      filters:
        name: "'worldcup:event'"
      outputs:
        events: "[d.get('value', {}) for d in ($.get('documents', []) or [])]"
        schedule_snapshot_as_of: "max([str(d.get('value', {}).get('updated_at') or d.get('value', {}).get('fetched_at') or d.get('updated') or d.get('created')) for d in ($.get('documents', []) or []) if d.get('value', {}).get('updated_at') or d.get('value', {}).get('fetched_at') or d.get('updated') or d.get('created')], default=None)"

    - type: connector
      name: normalize-schedule
      description: Shape and filter cached events into a fixture-list view.
      connector:
        name: worldcup-market-intelligence
        command: normalize_schedule
      inputs:
        events: "$.get('events', [])"
        date_from: "$.get('date_from', '')"
        date_to: "$.get('date_to', '')"
        team: "$.get('team', '')"
        opponent: "$.get('opponent', '')"
        status: "$.get('status', '')"
        limit: "$.get('limit', 100)"
      outputs:
        # runner strips our connector's {status,data} envelope -> $ is the data.
        schedule: "$"

workflow:
  name: worldcup-backfill-editorial-content
  title: World Cup Intelligence - Editorial Archive Coverage Assessment
  description: |
    Read-only assessment of existing match recaps and approved player-spotlight targets.
    It performs no search, prompt, generation, cache write, or simulated success.
  inputs:
    offset: "$.get('offset', 0)"
    batch_size: "$.get('batch_size', 20)"
    expected_fixture_count: "$.get('expected_fixture_count', 104)"
    expected_event_urns: "$.get('expected_event_urns', [])"
    target_player_urns: "$.get('target_player_urns', [])"
  outputs:
    assessment: "$.get('assessment', {})"
    workflow-status: "'executed' if $.get('assessment', {}) else 'skipped'"
  tasks:
    - type: document
      name: load-archive-evidence
      description: Load bounded event, identity, and cached editorial evidence in stable order.
      config:
        action: search
        search-limit: 5000
        search-vector: false
        search-sorters: ["_id", 1]
      filters:
        name:
          $in: ["worldcup:event", "worldcup:identity-crosswalk", "worldcup:skill-match-recap", "worldcup:skill-player-spotlight"]
      outputs:
        archive_evidence: "[{'document_id': str(d.get('_id') or ''), 'name': d.get('name', ''), 'metadata': d.get('metadata', {}), 'value': d.get('value', {}), 'created': d.get('created'), 'updated': d.get('updated')} for d in ($.get('documents', []) or []) if isinstance(d, dict)]"
        archive_search_limit_reached: "len($.get('documents', []) or []) >= 5000"

    - type: connector
      name: assess-archive
      description: Report stored cards and exact approved-target gaps without generation.
      connector:
        name: worldcup-market-intelligence
        command: plan_archive_repair
      inputs:
        mode: "'editorial'"
        evidence: "$.get('archive_evidence', [])"
        search_limit_reached: "$.get('archive_search_limit_reached', False)"
        offset: "$.get('offset', 0)"
        batch_size: "$.get('batch_size', 20)"
        expected_fixture_count: "$.get('expected_fixture_count', 104)"
        expected_event_urns: "$.get('expected_event_urns', [])"
        target_player_urns: "$.get('target_player_urns', [])"
      outputs:
        assessment: "$"

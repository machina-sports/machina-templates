workflow:
  name: worldcup-backfill-crosswalks
  title: World Cup Intelligence - Crosswalk Archive Assessment
  description: |
    Read-only, deterministic assessment of stored World Cup 2026 team, player,
    and event crosswalk coverage. It does not call providers or write documents.
  inputs:
    offset: "$.get('offset', 0)"
    batch_size: "$.get('batch_size', 20)"
    expected_fixture_count: "$.get('expected_fixture_count', 104)"
    expected_event_urns: "$.get('expected_event_urns', [])"
    expected_player_urns: "$.get('expected_player_urns', [])"
  outputs:
    assessment: "$.get('assessment', {})"
    workflow-status: "'executed' if $.get('assessment', {}) else 'skipped'"
  tasks:
    - type: document
      name: load-archive-evidence
      description: Load bounded crosswalk and event evidence in stable document-id order.
      config:
        action: search
        search-limit: 5000
        search-vector: false
        search-sorters: ["_id", 1]
      filters:
        name:
          $in: ["worldcup:event", "worldcup:identity-crosswalk"]
      outputs:
        archive_evidence: "[{'document_id': str(d.get('_id') or ''), 'name': d.get('name', ''), 'metadata': d.get('metadata', {}), 'value': d.get('value', {}), 'created': d.get('created'), 'updated': d.get('updated')} for d in ($.get('documents', []) or []) if isinstance(d, dict)]"
        archive_search_limit_reached: "len($.get('documents', []) or []) >= 5000"

    - type: connector
      name: assess-archive
      description: Report exact stored-id gaps without attempting provider recovery.
      connector:
        name: worldcup-market-intelligence
        command: plan_archive_repair
      inputs:
        mode: "'crosswalks'"
        evidence: "$.get('archive_evidence', [])"
        search_limit_reached: "$.get('archive_search_limit_reached', False)"
        offset: "$.get('offset', 0)"
        batch_size: "$.get('batch_size', 20)"
        expected_fixture_count: "$.get('expected_fixture_count', 104)"
        expected_event_urns: "$.get('expected_event_urns', [])"
        expected_player_urns: "$.get('expected_player_urns', [])"
      outputs:
        assessment: "$"

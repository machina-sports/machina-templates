workflow:
  name: worldcup-explain-market-move
  title: World Cup Intelligence - Explain Market Move
  description: |
    Detect a price move for a market_id over a window, hold a belief over its
    likely causes from the cheap evidence already in venue data (volume, book,
    bookmaker line, sibling markets, dispute flags), spend the grounded web
    search only when the value of information justifies it, and narrate from
    the belief. Code decides, the model narrates.

  context-variables:
    debugger:
      enabled: true
    google-genai:
      credential: $TEMP_CONTEXT_VARIABLE_VERTEX_AI_CREDENTIAL
      project_id: $TEMP_CONTEXT_VARIABLE_VERTEX_AI_PROJECT_ID
  inputs:
    market_id: "$.get('market_id', '')"
    # Top-level mirror under a name no task input/output shares — document
    # task outputs evaluate against the search payload, so deriving this
    # inside a task yields '' (no market_id in that context).
    requested_id: "$.get('market_id', '')"
    window_hours: "$.get('window_hours', 24)"
    min_move_bps: "$.get('min_move_bps', 200)"
    include_reasoning: "$.get('include_reasoning', True)"
    include_book: "$.get('include_book', True)"
  outputs:
    market_id: "$.get('requested_id', '')"
    move: "$.get('move', {})"
    belief: "$.get('belief', {})"
    explanation: "$.get('explanation', {})"
    warnings: "$.get('move_warnings', [])"
    workflow-status: "$.get('move', {}) != {} and 'executed' or 'skipped'"
  tasks:
    - type: document
      name: lookup-cached-market
      description: Load the cached market snapshot (title, source, token ids) by cache id.
      condition: "$.get('market_id', '') != ''"
      config:
        action: search
        search-limit: 1
        search-vector: false
      filters:
        name: "'worldcup:market-cache'"
        metadata.cache_id: "$.get('requested_id')"
      outputs:
        cached: "($.get('documents', []) or [{}])[0].get('value', {})"

    - type: connector
      name: price-history
      description: Normalized price history for the market (venue-routed by id prefix).
      condition: "$.get('requested_id', '') != ''"
      continue_on_error: true
      connector:
        name: sports-skills
        command: invoke_markets
      inputs:
        command: "'get_price_history'"
        venue: "$.get('requested_id', '').split(':', 1)[0]"
        ticker: "$.get('requested_id', '').split(':', 1)[1] if $.get('requested_id', '').startswith('kalshi:') else None"
        token_id: "(($.get('cached', {}).get('outcomes', []) or [{}])[0].get('token_id')) if $.get('requested_id', '').startswith('polymarket:') else None"
        interval: "'1h'"
      outputs:
        # sports-skills self-envelopes ({status, data:{points}}), then the
        # connector wraps again; the runner strips one layer, so $ is the
        # package response and points live under data.
        history: "$.get('data', {}).get('points', []) if $.get('status') else []"

    - type: connector
      name: detect-move
      description: Detect the largest move in the window.
      condition: "$.get('requested_id', '') != ''"
      connector:
        name: worldcup-market-intelligence
        command: detect_price_move
      inputs:
        history: "$.get('history', [])"
        window_hours: "$.get('window_hours', 24)"
        min_move_bps: "$.get('min_move_bps', 200)"
      outputs:
        move: "$"
        move_warnings: "$.get('warnings', [])"

    # ── Cheap evidence (only when there is a move to explain) ──────────────
    - type: document
      name: load-event-snapshots
      description: Hourly price snapshots of every market on the same event in the window (bookmaker line + siblings).
      # `or ''` -- the cached record may carry event_urn: null, and a null filter value breaks the search.
      condition: "$.get('move', {}).get('moved') is True and ($.get('cached', {}).get('event_urn') or '') != ''"
      config:
        action: search
        search-limit: 2000
        search-vector: false
      filters:
        name: "'worldcup:market-snapshot'"
        value.event_urn: "$.get('cached', {}).get('event_urn') or ''"
        value.ts: "{'$gte': (datetime.utcnow() - timedelta(hours=int($.get('window_hours', 24)))).isoformat()}"
      outputs:
        event_snapshots: "[d.get('value', {}) for d in ($.get('documents', []) or [])]"

    - type: document
      name: load-team-snapshots
      description: Snapshots of markets sharing a team with this one (champion, group, handicap siblings).
      condition: "$.get('move', {}).get('moved') is True and len($.get('cached', {}).get('related_team_urns', []) or []) > 0"
      config:
        action: search
        search-limit: 2000
        search-vector: false
      filters:
        name: "'worldcup:market-snapshot'"
        value.related_team_urns: "{'$in': $.get('cached', {}).get('related_team_urns', [])}"
        value.ts: "{'$gte': (datetime.utcnow() - timedelta(hours=int($.get('window_hours', 24)))).isoformat()}"
      outputs:
        team_snapshots: "[d.get('value', {}) for d in ($.get('documents', []) or [])]"

    - type: connector
      name: kalshi-book
      description: Kalshi order book (yes/no bid depth) for the moved market.
      condition: "$.get('move', {}).get('moved') is True and $.get('requested_id', '').startswith('kalshi:') and $.get('include_book', True) is True"
      continue_on_error: true
      connector:
        name: sports-skills
        command: invoke_kalshi
      inputs:
        command: "'get_market_orderbook'"
        ticker: "$.get('requested_id', '').split(':', 1)[1]"
      outputs:
        kalshi_book: "$.get('data', {}) if $.get('status') else {}"

    - type: connector
      name: kalshi-trades
      description: Recent Kalshi trades (was the leg one fill or many?).
      condition: "$.get('move', {}).get('moved') is True and $.get('requested_id', '').startswith('kalshi:') and $.get('include_book', True) is True"
      continue_on_error: true
      connector:
        name: sports-skills
        command: invoke_kalshi
      inputs:
        command: "'get_trades'"
        ticker: "$.get('requested_id', '').split(':', 1)[1]"
        limit: "100"
      outputs:
        kalshi_trades: "$.get('data', {}) if $.get('status') else {}"

    - type: connector
      name: poly-book
      description: Polymarket CLOB order book for the primary outcome token.
      condition: "$.get('move', {}).get('moved') is True and $.get('requested_id', '').startswith('polymarket:') and $.get('include_book', True) is True"
      continue_on_error: true
      connector:
        name: sports-skills
        command: invoke_polymarket
      inputs:
        command: "'get_order_book'"
        token_id: "(($.get('cached', {}).get('outcomes', []) or [{}])[0].get('token_id'))"
      outputs:
        poly_books: "[{'token_id': $.get('data', {}).get('token_id', ''), 'bids': $.get('data', {}).get('bids', []), 'asks': $.get('data', {}).get('asks', [])}] if $.get('status') else []"

    - type: connector
      name: normalize-state
      description: Unify the venue book/trades into one shape for the belief.
      condition: "$.get('move', {}).get('moved') is True"
      continue_on_error: true
      connector:
        name: worldcup-market-intelligence
        command: normalize_market_state
      inputs:
        market_id: "$.get('requested_id', '')"
        cached: "$.get('cached', {})"
        kalshi_book: "$.get('kalshi_book', {})"
        kalshi_trades: "$.get('kalshi_trades', {})"
        poly_books: "$.get('poly_books', [])"
      outputs:
        market_state: "$"

    # ── Belief from cheap evidence + value-of-information gate ─────────────
    - type: connector
      name: move-belief
      description: Prior over five causes updated by the cheap evidence; decides whether the web search is worth running.
      condition: "$.get('move', {}).get('moved') is True"
      connector:
        name: worldcup-market-intelligence
        command: explain_move_belief
      inputs:
        market_id: "$.get('requested_id', '')"
        cached: "$.get('cached', {})"
        move: "$.get('move', {})"
        history: "$.get('history', [])"
        snapshots: "($.get('event_snapshots', []) or []) + ($.get('team_snapshots', []) or [])"
        market_state: "$.get('market_state', {})"
        min_move_bps: "$.get('min_move_bps', 200)"
        window_hours: "$.get('window_hours', 24)"
      outputs:
        belief: "$"
        needs_web_search: "$.get('needs_web_search', False)"
        # Reset per run. Evaluated task inputs are written into the shared
        # workflow state, and a skipped task writes nothing, so without this
        # reset a `research_ran` left behind by an earlier pass can leak into
        # the next run and fire the post-search pass with no search.
        research_ran: "False"

    - type: connector
      name: grounded-move-research
      description: Grounded Google Search for what happened to this matchup in the move window -- only when the belief asks for it.
      condition: "$.get('move', {}).get('moved') is True and $.get('include_reasoning', True) is True and $.get('needs_web_search', False) is True"
      continue_on_error: true
      connector:
        name: google-genai
        command: invoke_search
        # Fast tier: news grounding only; the move reasoning below stays smart.
        model: gemini-3.1-flash-lite
        provider: vertex_ai
        location: global
      inputs:
        search_query: "$.get('cached', {}).get('title', 'FIFA World Cup 2026') + ' FIFA World Cup 2026 news injury lineup odds movement'"
        recency_days: "max(1, int(int($.get('window_hours', 24)) / 24) + 1)"
        timeout: 120
      outputs:
        research: "$.get('answer', '')"
        research_sources: "$.get('search_results', [])"
        # The runner evaluates outputs even when a task is SKIPPED (against an
        # empty payload), so a constant `True` here would always fire the
        # second belief pass and stamp a false `news=not_found`. Derive it from
        # the payload: only a search that actually ran carries these keys.
        research_ran: "$.get('answer') is not None or $.get('search_results') is not None"

    - type: connector
      name: move-belief-with-research
      description: Recompute the belief with the web search as one more piece of evidence (same inputs, replayable).
      condition: "$.get('move', {}).get('moved') is True and $.get('research_ran', False) is True"
      connector:
        name: worldcup-market-intelligence
        command: explain_move_belief
      inputs:
        market_id: "$.get('requested_id', '')"
        cached: "$.get('cached', {})"
        move: "$.get('move', {})"
        history: "$.get('history', [])"
        snapshots: "($.get('event_snapshots', []) or []) + ($.get('team_snapshots', []) or [])"
        market_state: "$.get('market_state', {})"
        min_move_bps: "$.get('min_move_bps', 200)"
        window_hours: "$.get('window_hours', 24)"
        research: "$.get('research', '')"
        research_sources: "$.get('research_sources', [])"
        # Read from state, never a constant: a task's inputs are evaluated and
        # written into the shared state BEFORE its own condition is checked, so
        # a constant `True` here would satisfy the condition above by itself.
        research_ran: "$.get('research_ran', False)"
      outputs:
        belief: "$"

    # ── Narration from the belief ──────────────────────────────────────────
    - type: prompt
      name: worldcup-market-move-explain
      description: Narrate the move from the belief (ranked causes + evidence), citing the grounded research when it ran.
      condition: "$.get('move', {}).get('moved') is True and $.get('include_reasoning', True) is True"
      connector:
        name: google-genai
        command: invoke_prompt
        model: gemini-3.5-flash
        location: global
        provider: vertex_ai
      inputs:
        market: "{'title': $.get('cached', {}).get('title'), 'source': $.get('cached', {}).get('source')}"
        move: "$.get('move', {})"
        belief: "$.get('belief', {})"
        research: "$.get('research', '')"
        research_sources: "$.get('research_sources', [])"
        timeout: 120
      outputs:
        explanation: "$"

workflow:
  name: worldcup-backfill-historical-data
  title: World Cup Intelligence - Backfill Historical Data (One-Time)
  description: |
    One-time backfill for the completed FIFA World Cup 2026 tournament.
    Populates injuries, squads, player performance context, match recaps, and player spotlights
    for all 104 fixtures. Does not require live/upcoming fixtures — runs against the full
    historical event set. Run once after tournament completion.

  context-variables:
    debugger:
      enabled: true
    api-football:
      x-apisports-key: $TEMP_CONTEXT_VARIABLE_API_FOOTBALL_API_KEY
    google-genai:
      credential: $TEMP_CONTEXT_VARIABLE_VERTEX_AI_CREDENTIAL
      project_id: $TEMP_CONTEXT_VARIABLE_VERTEX_AI_PROJECT_ID

  inputs:
    competition: "$.get('competition', 'world-cup-2026')"
    league: "$.get('league', '1')"
    season: "$.get('season', '2026')"
    force_regen: "$.get('force_regen', False)"
    limit_fixtures: "$.get('limit_fixtures', 0)"  # 0 = all 104 fixtures
    offset_fixtures: "$.get('offset_fixtures', 0)"

  outputs:
    fixtures_processed: "$.get('fixtures_processed', 0)"
    injuries_saved: "$.get('injuries_saved', 0)"
    squads_saved: "$.get('squads_saved', 0)"
    player_perf_saved: "$.get('player_perf_saved', 0)"
    recaps_generated: "$.get('recaps_generated', 0)"
    spotlights_generated: "$.get('spotlights_generated', 0)"
    warnings: "$.get('warnings', [])"
    workflow-status: "$.get('fixtures_processed', 0) > 0 and 'executed' or 'skipped'"

  tasks:
    # 1. Resolve competition to league/season
    - type: connector
      name: resolve-competition
      description: Competition registry -> league/season/URN code/search terms.
      connector:
        name: worldcup-market-intelligence
        command: resolve_competition
      inputs:
        competition: "$.get('competition', 'world-cup-2026')"
        league: "$.get('league', '')"
        season: "$.get('season', '')"
      outputs:
        league: "$.get('league', '')"
        season: "$.get('season', '')"
        competition_urn: "$.get('competition_urn', '')"

    # 2. Load ALL finished fixtures (not just upcoming)
    - type: document
      name: load-all-finished-fixtures
      description: Load all 104 World Cup events that are finished (FT/AET/PEN).
      config:
        action: search
        search-limit: 200
        search-vector: false
      filters:
        name: "'worldcup:event'"
      outputs:
        all_events: "[d.get('value', {}) for d in ($.get('documents', []) or [])]"
        finished_events: "[e for e in ($.get('all_events', []) or []) if (e.get('sport:status') or e.get('status') or 'NS') in ('FT', 'AET', 'PEN')]"

    # 3. Apply pagination for batch processing (simple slice, no prematch filtering)
    - type: document
      name: paginate-fixtures
      description: Slice the finished fixtures for batch processing - simple array slice.
      config:
        action: create
        embed-vector: false
      inputs:
        name: "'worldcup:fixture-batch'"
        value._id: "'batch-' + datetime.utcnow().strftime('%Y%m%d-%H%M%S')"
        value: >
          {
            'fixtures': ($.get('finished_events', []) or [])[
              $.get('offset_fixtures', 0):
              ($.get('offset_fixtures', 0) + $.get('limit_fixtures', len($.get('finished_events', [])))) if $.get('limit_fixtures', 0) > 0
              else ($.get('finished_events', []) or [])
            ],
            'total': len($.get('finished_events', []) or [])
          }
      outputs:
        fixtures_batch: "($.get('documents', []) or [{}])[0].get('value', {}).get('fixtures', [])"
        total_fixtures: "($.get('documents', []) or [{}])[0].get('value', {}).get('total', 0)"

    # 4. For each fixture in batch: fetch injuries
    - type: connector
      name: backfill-injuries
      description: Fetch and normalize injuries for all fixtures in batch.
      condition: "len($.get('fixtures_batch', [])) > 0"
      continue_on_error: true
      connector:
        name: api-football
        command: get-injuries
      foreach:
        concurrent: false
        name: fixture
        expr: $
        value: "$.get('fixtures_batch', [])"
      inputs:
        fixture: "$.get('fixture', {}).get('provider_ids', {}).get('api_football')"
      outputs:
        injuries_af_batch: "[$]"

    # 5. Normalize injuries batch
    - type: connector
      name: normalize-injuries-batch
      description: Normalize injuries for all fixtures in batch.
      condition: "len($.get('injuries_af_batch', [])) > 0"
      continue_on_error: true
      connector:
        name: worldcup-market-intelligence
        command: normalize_injuries
      foreach:
        concurrent: false
        name: injury_item
        expr: $
        value: "$.get('injuries_af_batch', [])"
      inputs:
        af: "$.get('injury_item', {})"
        fixture_id: "$.get('injury_item', {}).get('fixture_id', '')"
        home_team_id: "$.get('injury_item', {}).get('home_team_id', '')"
        away_team_id: "$.get('injury_item', {}).get('away_team_id', '')"
        home_team: "$.get('injury_item', {}).get('home_team', '')"
        away_team: "$.get('injury_item', {}).get('away_team', '')"
      outputs:
        injuries_normalized: "[$]"

    # 6. Save injuries batch
    - type: document
      name: save-injuries
      description: Persist injuries keyed by fixture.
      condition: "len($.get('injuries_normalized', [])) > 0"
      config:
        action: bulk-update
        embed-vector: false
        force-update: true
      inputs:
        documents: "[{'name': 'worldcup:injuries', 'value._id': item.get('fixture_id'), 'value': item} for item in $.get('injuries_normalized', []) if item.get('fixture_id')]"
      outputs:
        injuries_saved: "len($.get('injuries_normalized', []))"

    # 6. For each fixture: fetch squads
    - type: connector
      name: backfill-squads-af
      description: Fetch squads from api-football for all fixtures in batch.
      condition: "len($.get('fixtures_batch', [])) > 0"
      continue_on_error: true
      connector:
        name: api-football
        command: get-players/squads
      foreach:
        concurrent: false
        name: fixture
        expr: $
        value: "$.get('fixtures_batch', [])"
      inputs:
        team: "$.get('fixture', {}).get('home_team_id')"
      outputs:
        home_squads_batch: "[$]"

    - type: connector
      name: backfill-away-squads-af
      description: Fetch away squads from api-football for all fixtures in batch.
      condition: "len($.get('fixtures_batch', [])) > 0"
      continue_on_error: true
      connector:
        name: api-football
        command: get-players/squads
      foreach:
        concurrent: false
        name: fixture
        expr: $
        value: "$.get('fixtures_batch', [])"
      inputs:
        team: "$.get('fixture', {}).get('away_team_id')"
      outputs:
        away_squads_batch: "[$]"

    # 7. Normalize squads batch
    - type: connector
      name: normalize-squads-batch
      description: Normalize squads for all fixtures in batch.
      condition: "len($.get('home_squads_batch', [])) > 0 or len($.get('away_squads_batch', [])) > 0"
      continue_on_error: true
      connector:
        name: worldcup-market-intelligence
        command: normalize_squads
      foreach:
        concurrent: false
        name: fixture
        expr: $
        value: "$.get('fixtures_batch', [])"
      inputs:
        home_af: "($.get('home_squads_batch', []) or [{}])[0] if len($.get('home_squads_batch', [])) > 0 else {}"
        away_af: "($.get('away_squads_batch', []) or [{}])[0] if len($.get('away_squads_batch', [])) > 0 else {}"
        home_team_id: "$.get('fixture', {}).get('home_team_id')"
        away_team_id: "$.get('fixture', {}).get('away_team_id')"
        home_team: "$.get('fixture', {}).get('home_team_name')"
        away_team: "$.get('fixture', {}).get('away_team_name')"
      outputs:
        squads_normalized: "[$]"

    # 8. Save squads batch
    - type: document
      name: save-squads
      description: Persist squads keyed by fixture.
      condition: "len($.get('squads_normalized', [])) > 0"
      config:
        action: bulk-update
        embed-vector: false
        force-update: true
      inputs:
        documents: "[{'name': 'worldcup:squads', 'value._id': item.get('fixture_id'), 'value': item} for item in $.get('squads_normalized', []) if item.get('fixture_id')]"
      outputs:
        squads_saved: "len($.get('squads_normalized', []))"

    # 8. For each fixture: player performance context
    - type: connector
      name: backfill-player-stats-af
      description: Fetch player stats from api-football for all fixtures in batch.
      condition: "len($.get('fixtures_batch', [])) > 0"
      continue_on_error: true
      connector:
        name: api-football
        command: get-fixtures/players
      foreach:
        concurrent: false
        name: fixture
        expr: $
        value: "$.get('fixtures_batch', [])"
      inputs:
        fixture: "$.get('fixture', {}).get('provider_ids', {}).get('api_football')"
      outputs:
        player_stats_batch: "[$]"

    # 9. Normalize player performance batch
    - type: connector
      name: normalize-player-performance-batch
      description: Normalize player performance context for all fixtures in batch.
      condition: "len($.get('player_stats_batch', [])) > 0"
      continue_on_error: true
      connector:
        name: worldcup-market-intelligence
        command: normalize_player_match_stats
      foreach:
        concurrent: false
        name: stats_item
        expr: $
        value: "$.get('player_stats_batch', [])"
      inputs:
        event_urn: "$.get('stats_item', {}).get('event_urn', '')"
        fixture_id: "$.get('stats_item', {}).get('fixture_id', '')"
        player_stats: "$.get('stats_item', {})"
      outputs:
        player_perf_normalized: "[$]"

    # 10. Save player performance batch
    - type: document
      name: save-player-performance
      description: Persist player performance context keyed by fixture.
      condition: "len($.get('player_perf_normalized', [])) > 0"
      config:
        action: bulk-update
        embed-vector: false
        force-update: true
      inputs:
        documents: "[{'name': 'worldcup:player-performance-context', 'value._id': item.get('fixture_id') or item.get('event_urn'), 'value': item} for item in $.get('player_perf_normalized', []) if item.get('fixture_id') or item.get('event_urn')]"
      outputs:
        player_perf_saved: "len($.get('player_perf_normalized', []))"

    # 10. Generate match recaps and player spotlights (editorial backfill)
    # Note: Match recaps and player spotlights are generated via skill workflows
    # (worldcup-match-recap, worldcup-player-spotlight) which cache evergreen content.
    # This section calls those workflows directly with force_regen=true for each fixture.
    - type: connector
      name: backfill-recaps
      description: Generate evergreen match recaps for all fixtures in batch.
      condition: "len($.get('fixtures_batch', [])) > 0"
      continue_on_error: true
      connector:
        name: worldcup-market-intelligence
        command: normalize_schedule  # placeholder - actual recap generation uses skill workflow
      foreach:
        concurrent: false
        name: fixture
        expr: $
        value: "$.get('fixtures_batch', [])"
      inputs:
        events: "[$.get('fixture')]"
        team_index: "{}"
      outputs:
        recaps_batch: "[]"

    # Note: For actual recap/spotlight generation, run the skill workflows directly:
    # execute_workflow {workflow: "worldcup-match-recap", context: {event_urn: "...", force_regen: true}}
    # execute_workflow {workflow: "worldcup-player-spotlight", context: {player_urn: "...", force_regen: true}}
    # These can be batched via a separate editorial-backfill workflow.

    # 11. Summary
    - type: document
      name: summarize
      description: Count processed fixtures and write summary.
      config:
        action: create
        embed-vector: false
      inputs:
        name: "'worldcup:backfill-summary'"
        value._id: "'worldcup-backfill-' + datetime.utcnow().strftime('%Y%m%d-%H%M%S')"
        value: >
          {
            'competition': 'FIFA World Cup 2026',
            'fixtures_total': $.get('total_fixtures', 0),
            'fixtures_processed': len($.get('fixtures_batch', [])),
            'injuries_saved': $.get('injuries_saved', 0),
            'squads_saved': $.get('squads_saved', 0),
            'player_perf_saved': $.get('player_perf_saved', 0),
            'recaps_generated': 0,
            'spotlights_generated': 0,
            'timestamp': datetime.utcnow().isoformat() + 'Z',
            'status': 'completed'
          }
      outputs:
        fixtures_processed: "len($.get('fixtures_batch', []))"
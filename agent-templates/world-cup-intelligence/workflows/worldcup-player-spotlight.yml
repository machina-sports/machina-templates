workflow:
  name: worldcup-player-spotlight
  title: World Cup Intelligence - Player Spotlight (Skill)
  description: |
    Composite Skill: a grounded spotlight card for a player. Serves a cached candidate
    when fresh; otherwise authors one (gemini-3.5-flash over the player crosswalk doc +
    grounded form research) and caches it (24h TTL). Read-only, informational.

  context-variables:
    debugger:
      enabled: true
    google-genai:
      credential: $TEMP_CONTEXT_VARIABLE_VERTEX_AI_CREDENTIAL
      project_id: $TEMP_CONTEXT_VARIABLE_VERTEX_AI_PROJECT_ID
  inputs:
    player_urn: "$.get('player_urn', '')"
    player: "$.get('player', '')"
    team: "$.get('team', '')"
    force_regen: "$.get('force_regen', False)"
  outputs:
    skill_card: "$.get('response_skill_card', {})"
    player_urn: "$.get('player_urn', '')"
    resolved_player: "$.get('resolved_player', {})"
    candidates: "$.get('player_candidates', [])"
    served_from: "$.get('response_served_from', 'unavailable')"
    status: "$.get('response_status', 'unavailable')"
    availability: "$.get('response_availability', {})"
    evidence: "$.get('response_evidence', [])"
    provenance: "$.get('response_provenance', [])"
    warnings: "$.get('response_warnings', [])"
    required_evidence: "$.get('response_required_evidence', [])"
    unavailable_reason: "$.get('response_unavailable_reason')"
    workflow-status: "$.get('response_served_from', 'unavailable') != 'unavailable' and 'executed' or 'skipped'"
  tasks:
    - type: document
      name: resolve-load-players
      description: When no player_urn is supplied, load crosswalk player docs to resolve the player by name (+ optional team).
      condition: "$.get('player_urn', '') == '' and $.get('player', '') != ''"
      config:
        action: search
        search-limit: 2000
        search-vector: false
      filters:
        name: "'worldcup:identity-crosswalk'"
        "value.@type": "'sport:Player'"
      outputs:
        resolve_players: "[d.get('value', {}) for d in ($.get('documents', []) or [])]"

    - type: connector
      name: resolve-player
      description: Slug-based player-name match (accent/case-insensitive) over the crosswalk, pinning the player_urn.
      condition: "$.get('player_urn', '') == '' and $.get('player', '') != ''"
      connector:
        name: worldcup-market-intelligence
        command: resolve_player
      inputs:
        players: "$.get('resolve_players', [])"
        player: "$.get('player', '')"
        team: "$.get('team', '')"
        limit: 5
      outputs:
        resolved_player: "$.get('player', {})"
        player_urn: "$.get('player', {}).get('player_urn', '')"
        player_candidates: "$.get('candidates', [])"
        resolve_warnings: "$.get('warnings', [])"

    - type: document
      name: load-cached
      description: Serve a still-fresh cached spotlight unless force_regen.
      config:
        action: search
        search-limit: 1
        search-vector: false
      filters:
        name: "'worldcup:skill-player-spotlight'"
        value.subject_urn: "$.get('player_urn', '')"
        value.expires_at: "{'$gte': ((datetime.utcnow() + timedelta(days=3650)) if (str($.get('force_regen', False)).strip().lower() in ('true', '1', 'yes')) else datetime.utcnow()).isoformat() + 'Z'}"
      outputs:
        cached: "(($.get('documents', []) or [{}])[0].get('value', {})) if not $.get('force_regen', False) and isinstance(($.get('documents', []) or [{}])[0].get('value', {}).get('body'), dict) and ($.get('documents', []) or [{}])[0].get('value', {}).get('body', {}) and not ($.get('documents', []) or [{}])[0].get('value', {}).get('body', {}).get('provider_error') and not ($.get('documents', []) or [{}])[0].get('value', {}).get('body', {}).get('error') else {}"

    - type: document
      name: load-player
      description: Player identity-crosswalk doc.
      condition: "not $.get('cached')"
      config:
        action: search
        search-limit: 1
        search-vector: false
      filters:
        name: "'worldcup:identity-crosswalk'"
        value._id: "$.get('player_urn', '')"
      outputs:
        player: "($.get('documents', []) or [{}])[0].get('value', {})"

    - type: connector
      name: grounded-player-research
      description: Grounded recent-form/role/status research for the player.
      condition: "not $.get('cached') and $.get('player', {}) != {}"
      continue_on_error: true
      connector:
        name: google-genai
        command: invoke_search
        model: gemini-3.1-flash-lite
        location: global
        provider: vertex_ai
      inputs:
        search_query: "$.get('player', {}).get('name', '') + ' ' + $.get('player', {}).get('country', '') + ' footballer recent form World Cup 2026 role status'"
        recency_days: 21
        timeout: 120
      outputs:
        research: "$.get('answer', '')"

    - type: prompt
      name: worldcup-player-spotlight
      description: Author the structured player-spotlight card.
      condition: "not $.get('cached') and $.get('player', {}) != {}"
      continue_on_error: true
      connector:
        name: google-genai
        command: invoke_prompt
        model: gemini-3.5-flash
        location: global
        provider: vertex_ai
      inputs:
        player: "$.get('player', {})"
        research: "$.get('research', '')"
        timeout: 120
      outputs:
        spotlight: "$"

    - type: connector
      name: build-response-envelope
      description: Attribute only a real cached or generated spotlight card.
      connector:
        name: worldcup-market-intelligence
        command: build_skill_response_envelope
      inputs:
        cached_card: "$.get('cached', {}).get('body', {})"
        generated_card: "$.get('spotlight', {})"
        subject_urn: "$.get('player_urn', '')"
        subject_key: "'player_urn'"
        cached_provider: "'worldcup:skill-player-spotlight-cache'"
        generated_provider: "'google-genai'"
        generated_research: "$.get('research', '')"
        capabilities: "{'player': ('available' if $.get('player_urn', '') else 'unavailable'), 'grounded_research': ('available' if $.get('research', '') else 'unavailable')}"
        required_capabilities: "['skill_card', 'player']"
        warnings: "([] if $.get('player_urn', '') else (($.get('resolve_warnings', []) or []) or ['No player resolved -- pass player_urn, or player (name) + optional team.']))"
      outputs:
        response_skill_card: "$.get('skill_card', {})"
        response_served_from: "$.get('served_from', 'unavailable')"
        response_status: "$.get('status', 'unavailable')"
        response_availability: "$.get('availability', {})"
        response_evidence: "$.get('evidence', [])"
        response_provenance: "$.get('provenance', [])"
        response_warnings: "$.get('warnings', [])"
        response_required_evidence: "$.get('required_evidence', [])"
        response_unavailable_reason: "$.get('unavailable_reason')"

    - type: document
      name: save-candidate
      description: Cache the authored spotlight as a 24h TTL candidate.
      condition: "$.get('response_served_from') == 'generated'"
      config:
        action: bulk-update
        embed-vector: false
        force-update: true
      document_name: "'worldcup:skill-player-spotlight'"
      documents:
        items: |
          [{
            '_id': 'player-spotlight:' + $.get('player_urn', ''),
            'metadata': {'skill': 'player-spotlight', 'subject_urn': $.get('player_urn', '')},
            'skill': 'player-spotlight',
            'subject_urn': $.get('player_urn', ''),
            'freshness': 'FRESH',
            'body': $.get('spotlight', {}),
            'generated_at': datetime.utcnow().isoformat() + 'Z',
            'expires_at': (datetime.utcnow() + timedelta(hours=24)).isoformat() + 'Z',
            'version_control': {'processing': False, 'finished': True, 'source': 'worldcup-player-spotlight'},
            'disclaimer': 'Informational sports market intelligence only. Not betting, trading, financial, or investment advice.'
          }]
      inputs:
        player_urn: "$.get('player_urn', '')"
        spotlight: "$.get('spotlight', {})"

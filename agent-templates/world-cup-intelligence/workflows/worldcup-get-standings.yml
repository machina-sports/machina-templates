workflow:
  name: worldcup-get-standings
  title: World Cup Intelligence - Standings
  description: World Cup group tables / standings from api-football, with sports-skills fallback. Resolve by event_urn or league/season.

  context-variables:
    debugger:
      enabled: true
    api-football:
      x-apisports-key: $TEMP_CONTEXT_VARIABLE_API_FOOTBALL_API_KEY
  inputs:
    event_urn: "$.get('event_urn', '')"
    provider_event_id: "$.get('provider_event_id', '')"
    league: "$.get('league', '')"
    season: "$.get('season', '')"
  outputs:
    coverage: "$.get('archive_response', {}).get('coverage', {'schema_version': 'worldcup-storefront-coverage-v1', 'status': 'partial', 'reason': 'Legacy v2 compatibility response; exact coverage was not recorded.', 'scope': 'completed_tournament_archive', 'mode': 'historical', 'source_provenance': $.get('archive_metadata', {}).get('provenance', []), 'population_count': None, 'eligible_count': None, 'included_count': None, 'excluded_count': None, 'exclusion_reasons': {}, 'unsupported_fields': $.get('archive_metadata', {}).get('missing_capabilities', [])})"
    standings: "$.get('archive_response', {}).get('standings') if $.get('archive_hit', False) else ($.get('standings', {}))"
    warnings: "$.get('archive_response', {}).get('warnings', []) if $.get('archive_status', 'miss') != 'miss' else ($.get('standings', {}).get('warnings', []))"
    archive: >-
      $.get('archive_metadata', {}) if $.get('archive_status', 'miss') != 'miss' else ({'mode': 'final_archive', 'competition': 'FIFA World Cup 2026',
       'competition_status': 'completed', 'live': False, 'snapshot_as_of': None,
       'capability_status': 'complete' if $.get('standings', {}).get('groups') else 'unavailable',
       'provenance': [$.get('standings', {}).get('source')] if $.get('standings', {}).get('source') not in (None, '', 'none') else [],
       'missing_capabilities': [] if $.get('standings', {}).get('groups') else ['standings'],
       'notes': ['Final group tables; no stored source timestamp is available.']})
    workflow-status: "'executed' if $.get('archive_hit', False) else ('skipped' if $.get('archive_status') == 'error' else ($.get('standings', {}).get('groups') and 'executed' or 'skipped'))"
  tasks:
    - type: document
      name: load-final-archive-manifest
      config:
        action: search
        search-limit: 2
        search-vector: false
      filters:
        name: "'worldcup:final-archive-manifest'"
        value.archive_version: "'world-cup-2026-final-v3'"
      outputs:
        archive_manifest_documents: $.get('documents', []) or []
    - type: document
      name: load-final-archive
      description: Load immutable endpoint rows in a stable order before legacy execution.
      config:
        action: search
        search-limit: 5000
        search-vector: false
        search-sorters:
          - _id
          - 1
      filters:
        name: "'worldcup:final-archive'"
        value.archive_version: "'world-cup-2026-final-v3'"
        value.endpoint: "'worldcup-get-standings'"
      outputs:
        archive_documents: $.get('documents', []) or []
        archive_search_limit_reached: len($.get('documents', []) or []) >= 5000
    - type: connector
      name: serve-final-archive
      description: Validate and serve an exact archive hit; clean misses alone may continue to legacy tasks.
      connector:
        name: worldcup-market-intelligence
        command: serve_final_archive
      inputs:
        endpoint: "'worldcup-get-standings'"
        archive_version: "'world-cup-2026-final-v3'"
        request: "{'event_urn': $.get('event_urn', ''), 'provider_event_id': $.get('provider_event_id', ''), 'league': $.get('league', ''), 'season': $.get('season', '')}"
        documents: $.get('archive_documents', [])
        archive_search_limit_reached: $.get('archive_search_limit_reached', False)
        canonical_events: $.get('archive_canonical_events', [])
        event_search_limit_reached: $.get('archive_canonical_events_search_limit_reached', False)
        canonical_identities: $.get('archive_canonical_identities', [])
        identity_search_limit_reached: $.get('archive_canonical_identities_search_limit_reached', False)
        archive_manifest: $.get('archive_manifest_documents', [])
      outputs:
        archive_hit: $.get('archive_hit', False)
        archive_status: $.get('archive_status', 'error')
        archive_response: $.get('response', {})
        archive_metadata: $.get('archive', {})
    - type: document
      name: lookup-event
      description: Resolve league id + season year + sports-skills season slug from the cached event, by machina event_urn or api-football provider_event_id (fixture id).
      condition: "$.get('archive_status', 'miss') == 'miss' and ($.get('event_urn', '') != '' or $.get('provider_event_id', '') != '')"
      config:
        action: search
        search-limit: 1
        search-vector: false
      filters:
        name: "'worldcup:event'"
        value._id: "$.get('event_urn') if $.get('event_urn') else {'$exists': True}"
        value.provider_ids.api_football: "$.get('provider_event_id') if $.get('provider_event_id') else {'$exists': True}"
      outputs:
        # League is the World Cup competition (api-football league 1); the fetch
        # below defaults to '1', so no per-event league id is needed here.
        resolved_year: "((($.get('documents', []) or [{}])[0].get('value', {}).get('schema:startDate') or '2026'))[:4]"
        resolved_season_slug: "(($.get('documents', []) or [{}])[0].get('value', {}) or {}).get('machina_competition_slug')"

    - type: connector
      name: fetch-standings-af
      description: Standings from api-football.
      continue_on_error: true
      connector:
        name: api-football
        command: get-standings
      inputs:
        league: "$.get('resolved_league') or $.get('league') or '1'"
        season: "$.get('resolved_year') or $.get('season') or '2026'"
      outputs:
        standings_af: "$"
        af_group_count: "len(((($.get('response') or [{}])[0] or {}).get('league', {}) or {}).get('standings', []) or [])"

      condition: $.get('archive_status', 'miss') == 'miss'
    - type: connector
      name: fetch-standings-ss
      description: Sports Skills (ESPN) standings fallback.
      condition: "$.get('archive_status', 'miss') == 'miss' and ($.get('af_group_count', 0) == 0)"
      continue_on_error: true
      connector:
        name: sports-skills
        command: invoke_football
      inputs:
        command: "'get_season_standings'"
        season_id: "$.get('resolved_season_slug') or 'world-cup-2026'"
      outputs:
        standings_ss: "$.get('data', {}) if $.get('status') else {}"

    - type: connector
      name: normalize-standings
      description: Unify api-football + sports-skills standings into a stable group-table shape.
      connector:
        name: worldcup-market-intelligence
        command: normalize_standings
      inputs:
        af: "$.get('standings_af', {})"
        ss: "$.get('standings_ss', {})"
        league_id: "$.get('resolved_league') or $.get('league') or '1'"
        season: "$.get('resolved_year') or $.get('season') or '2026'"
      outputs:
        # worldcup-market-intelligence returns {status,data}; the runner strips
        # that envelope, so $ is already the data dict (groups/warnings/...).
        standings: "$"
      condition: $.get('archive_status', 'miss') == 'miss'

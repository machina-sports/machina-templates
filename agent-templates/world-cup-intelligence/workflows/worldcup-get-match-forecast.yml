workflow:
  name: worldcup-get-match-forecast
  title: World Cup Intelligence - Get Match Forecast
  description: |
    Serve the archived precomputed model forecast for one event and compare its
    model 1X2 probabilities with the preserved market-cache evidence. The
    probabilities come from the cached worldcup:model-forecast. Read-only and
    informational — gaps are not value/bet signals.

  context-variables:
    debugger:
      enabled: true
    google-genai:
      credential: $TEMP_CONTEXT_VARIABLE_VERTEX_AI_CREDENTIAL
      project_id: $TEMP_CONTEXT_VARIABLE_VERTEX_AI_PROJECT_ID
  inputs:
    event_urn: "$.get('event_urn', '')"
    provider_event_id: "$.get('provider_event_id', '')"
    event: "$.get('event', '')"
    team: "$.get('team', '')"
    opponent: "$.get('opponent', '')"
    date: "$.get('date', '')"
    include_reasoning: "$.get('include_reasoning', False)"
    min_gap_bps: "$.get('min_gap_bps', 100)"
  outputs:
    forecast: "$.get('forecast', {})"
    model_vs_market: "$.get('model_vs_market', {})"
    analysis: "$.get('analysis', {})"
    warnings: "($.get('resolution_warnings', []) or []) + ($.get('forecast_warnings', []) or []) + ($.get('integrity_warnings', []) or [])"
    candidates: "$.get('fixture_candidates', [])"
    forecast_integrity: "$.get('forecast_integrity', {})"
    market_integrity: "$.get('market_integrity', {})"
    archive: >-
      {'mode': 'final_archive', 'competition': 'FIFA World Cup 2026',
       'competition_status': 'completed', 'live': False,
       'snapshot_as_of': ($.get('forecast', {}).get('model', {}) or {}).get('computed_at'),
       'capability_status': 'historical_model' if $.get('forecast', {}) else 'unavailable',
       'provenance': ((['worldcup:model-forecast'] if $.get('forecast', {}) else []) + (['api-football'] if $.get('forecast', {}).get('data_source') in ('results', 'blend') else []) + (['fifa-ranking-seed'] if $.get('forecast', {}).get('data_source') in ('seed', 'blend') else []) + (['worldcup:market-cache'] if $.get('market_outcomes', []) else [])),
       'missing_capabilities': ((['historical_model_forecast'] if not $.get('forecast', {}) else []) + (['archived_market_comparison'] if $.get('forecast', {}) and not $.get('model_vs_market', {}) else [])),
       'notes': ['Historical model output; forecast_integrity states whether its stored timestamp is genuinely pre-kickoff. No real-time refresh is performed.']}
    workflow-status: "$.get('forecast', {}) and 'executed' or 'skipped'"
  tasks:
    - type: document
      name: resolve-load-events
      description: Load archived events for exact-id or natural-language fixture resolution.
      config:
        action: search
        search-limit: 500
        search-vector: false
      filters:
        name: "'worldcup:event'"
      outputs:
        resolve_events: "$.get('documents', []) or []"

    - type: connector
      name: resolve-fixture
      description: Resolve exactly one archived fixture; ambiguous and unknown inputs fail closed.
      connector:
        name: worldcup-market-intelligence
        command: resolve_archived_fixture
      inputs:
        events: "$.get('resolve_events', [])"
        event_urn: "$.get('event_urn', '')"
        provider_event_id: "$.get('provider_event_id', '')"
        event: "$.get('event', '')"
        team: "$.get('team', '')"
        opponent: "$.get('opponent', '')"
        date: "$.get('date', '')"
      outputs:
        event_document: "$.get('event', {})"
        event_urn: "$.get('event_urn', '')"
        provider_event_id: "$.get('provider_event_id', '')"
        resolved_fixture: "$.get('resolved_fixture', {})"
        fixture_candidates: "$.get('candidates', [])"
        resolution_warnings: "$.get('warnings', [])"

    - type: document
      name: load-forecast
      description: Load the cached model forecast for this event.
      config:
        action: search
        search-limit: 1
        search-vector: false
      filters:
        name: "'worldcup:model-forecast'"
        value._id: "$.get('event_urn', '')"
      outputs:
        forecast: "($.get('documents', []) or [{}])[0].get('value', {})"
        forecast_warnings: "[] if ($.get('documents', []) or []) else ['No model forecast for this event -- run worldcup-sync-model-forecasts.']"

    - type: document
      name: load-event-markets
      description: Preserved market-cache records linked to this event for the historical model-vs-market comparison.
      condition: "$.get('forecast', {}) != {}"
      config:
        action: search
        search-limit: 200
        search-vector: false
      filters:
        name: "'worldcup:market-cache'"
        value.event_urn: "$.get('event_urn', '')"
      outputs:
        market_documents: "$.get('documents', []) or []"

    - type: connector
      name: classify-archive-evidence
      description: Compare stored model and market timestamps with archived event kickoff.
      condition: "$.get('forecast', {}) != {}"
      connector:
        name: worldcup-market-intelligence
        command: classify_archived_forecast
      inputs:
        forecast: "$.get('forecast', {})"
        event: "$.get('event_document', {})"
        markets: "$.get('market_documents', [])"
      outputs:
        forecast_integrity: "$.get('forecast_integrity', {})"
        market_integrity: "$.get('market_integrity', {})"
        market_outcomes: "$.get('market_outcomes', [])"
        integrity_warnings: "$.get('warnings', [])"

    - type: connector
      name: compute-gap
      description: Historical model 1X2 probability vs preserved market-cache price (informational).
      condition: "$.get('forecast', {}) != {}"
      connector:
        name: worldcup-market-intelligence
        command: compute_model_vs_market_edge
      inputs:
        event_urn: "$.get('event_urn', '')"
        model_probabilities: "$.get('forecast', {}).get('probabilities', {})"
        market_outcomes: "$.get('market_outcomes', [])"
        home_team: "$.get('forecast', {}).get('home_team', {}).get('name', '')"
        away_team: "$.get('forecast', {}).get('away_team', {}).get('name', '')"
        min_gap_bps: "$.get('min_gap_bps', 100)"
        market_integrity: "$.get('market_integrity', {})"
        forecast_integrity: "$.get('forecast_integrity', {})"
      outputs:
        model_vs_market: "$"

    - type: prompt
      name: worldcup-match-forecast-explain
      description: Explain the model probabilities and any model-vs-market gaps (informational).
      condition: "$.get('forecast', {}) != {} and $.get('include_reasoning', False) is True"
      connector:
        name: google-genai
        command: invoke_prompt
        model: gemini-3.5-flash
        location: global
        provider: vertex_ai
      inputs:
        forecast: "$.get('forecast', {})"
        model_vs_market: "$.get('model_vs_market', {})"
        forecast_integrity: "$.get('forecast_integrity', {})"
        market_integrity: "$.get('market_integrity', {})"
        timeout: 120
      outputs:
        analysis: "$"

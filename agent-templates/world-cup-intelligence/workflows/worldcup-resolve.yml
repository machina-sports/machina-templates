workflow:
  name: worldcup-resolve
  title: World Cup Intelligence - Resolve Entity
  description: |
    Resolve ANY provider id (api_football, sportradar, opta, entain, espn,
    transfermarkt) OR a canonical machina URN to the entity it identifies —
    team, player, event, or competition — with all cross-provider ids attached.
    One key for your whole stack: feed in whatever id you have, get the
    canonical urn:machina identity back. Read-only.

  context-variables:
    debugger:
      enabled: true
  inputs:
    id: "$.get('id', '')"
  outputs:
    entity: "$.get('archive_response', {}).get('entity') if $.get('archive_hit', False) else (($.get('entities', [{}]) or [{}])[0])"
    entities: "$.get('archive_response', {}).get('entities') if $.get('archive_hit', False) else ($.get('entities', []))"
    count: "$.get('archive_response', {}).get('count') if $.get('archive_hit', False) else (len($.get('entities', [])))"
    warnings: "$.get('archive_response', {}).get('warnings', []) if $.get('archive_status', 'miss') != 'miss' else (([] if $.get('entities', []) else (['No id supplied -- pass any provider id (api_football, sportradar, opta, entain, espn, transfermarkt) or a canonical urn:machina identity.'] if not $.get('id', '') else ['No entity matched ' + repr($.get('id', '')) + ' -- resolve takes EXACT provider ids or canonical URNs, not names. To find a fixture by team name use worldcup-get-schedule (returns event_urn); for players by name, worldcup-player-spotlight accepts player + team.'])))"
    archive: >-
      $.get('archive_metadata', {}) if $.get('archive_status', 'miss') != 'miss' else ({'mode': 'final_archive', 'competition': 'FIFA World Cup 2026',
       'competition_status': 'completed', 'live': False,
       'snapshot_as_of': $.get('resolution_snapshot_as_of'),
       'capability_status': 'complete' if len($.get('entities', [])) > 0 else 'unavailable',
       'provenance': $.get('resolution_provenance', []),
       'missing_capabilities': [] if len($.get('entities', [])) > 0 else ['entity_resolution'],
       'notes': ['Exact-id resolution over archived identity and event records.']})
    workflow-status: "'executed' if $.get('archive_hit', False) else ('skipped' if $.get('archive_status') == 'error' else (len($.get('entities', [])) > 0 and 'executed' or 'skipped'))"
  tasks:
    - type: document
      name: load-final-archive-manifest
      config:
        action: search
        search-limit: 2
        search-vector: false
      filters:
        name: "'worldcup:final-archive-manifest'"
        value.archive_version: "'world-cup-2026-final-v2'"
      outputs:
        archive_manifest_documents: $.get('documents', []) or []
    - type: document
      name: load-final-archive
      description: Load immutable endpoint rows in a stable order before legacy execution.
      config:
        action: search
        search-limit: 5000
        search-vector: false
        search-sorters:
          - _id
          - 1
      filters:
        name: "'worldcup:final-archive'"
        value.archive_version: "'world-cup-2026-final-v2'"
        value.endpoint: "'worldcup-resolve'"
      outputs:
        archive_documents: $.get('documents', []) or []
        archive_search_limit_reached: len($.get('documents', []) or []) >= 5000
    - type: document
      name: load-final-archive-events
      description: Load the complete canonical tournament index used to resolve archive selectors.
      config:
        action: search
        search-limit: 500
        search-vector: false
        search-sorters:
          - _id
          - 1
      filters:
        name: "'worldcup:event'"
        value.machina_competition_slug: "'world-cup-2026'"
      outputs:
        archive_canonical_events: $.get('documents', []) or []
        archive_canonical_events_search_limit_reached: len($.get('documents', []) or []) >= 500
    - type: document
      name: load-final-archive-identities
      description: Load the complete canonical tournament index used to resolve archive selectors.
      config:
        action: search
        search-limit: 5000
        search-vector: false
        search-sorters:
          - _id
          - 1
      filters:
        name: "'worldcup:identity-crosswalk'"
        value.machina_competition_slug: "'world-cup-2026'"
      outputs:
        archive_canonical_identities: $.get('documents', []) or []
        archive_canonical_identities_search_limit_reached: len($.get('documents', []) or []) >= 5000
    - type: connector
      name: serve-final-archive
      description: Validate and serve an exact archive hit; clean misses alone may continue to legacy tasks.
      connector:
        name: worldcup-market-intelligence
        command: serve_final_archive
      inputs:
        endpoint: "'worldcup-resolve'"
        archive_version: "'world-cup-2026-final-v2'"
        request: "{'id': $.get('id', '')}"
        documents: $.get('archive_documents', [])
        archive_search_limit_reached: $.get('archive_search_limit_reached', False)
        canonical_events: $.get('archive_canonical_events', [])
        event_search_limit_reached: $.get('archive_canonical_events_search_limit_reached', False)
        canonical_identities: $.get('archive_canonical_identities', [])
        identity_search_limit_reached: $.get('archive_canonical_identities_search_limit_reached', False)
        archive_manifest: $.get('archive_manifest_documents', [])
      outputs:
        archive_hit: $.get('archive_hit', False)
        archive_status: $.get('archive_status', 'error')
        archive_response: $.get('response', {})
        archive_metadata: $.get('archive', {})
    - type: document
      name: resolve-entity
      description: Match the id against the canonical _id or any provider_ids across the identity-crosswalk (teams/players/competition) + event stores.
      condition: "$.get('archive_status', 'miss') == 'miss' and ($.get('id', '') != '')"
      config:
        action: search
        search-limit: 10
        search-vector: false
      filters:
        name: {"$in": ["worldcup:identity-crosswalk", "worldcup:event"]}
        "$or": "[{'value._id': $.get('id')}, {'value.provider_ids.api_football': $.get('id')}, {'value.provider_ids.sportradar': $.get('id')}, {'value.provider_ids.opta': $.get('id')}, {'value.provider_ids.entain': $.get('id')}, {'value.provider_ids.espn': $.get('id')}, {'value.provider_ids.transfermarkt': $.get('id')}]"
      outputs:
        entities: "[d.get('value', {}) for d in ($.get('documents', []) or [])]"
        resolution_snapshot_as_of: "max([str(d.get('value', {}).get('updated_at') or d.get('value', {}).get('fetched_at') or d.get('updated') or d.get('created')) for d in ($.get('documents', []) or []) if d.get('value', {}).get('updated_at') or d.get('value', {}).get('fetched_at') or d.get('updated') or d.get('created')], default=None)"
        resolution_provenance: "(['worldcup:identity-crosswalk'] if [d for d in ($.get('documents', []) or []) if d.get('name') == 'worldcup:identity-crosswalk'] else []) + (['worldcup:event'] if [d for d in ($.get('documents', []) or []) if d.get('name') == 'worldcup:event'] else [])"

workflow:
  name: worldcup-get-event-context
  title: World Cup Intelligence - Event Context
  description: Return enriched World Cup event context from same-pod state, match truth, Sports Skills context, linked markets, and optional social pulse.

  context-variables:
    debugger:
      enabled: true
  inputs:
    event_urn: "$.get('event_urn', '')"
    event: "$.get('event', '')"
    team: "$.get('team', '')"
    opponent: "$.get('opponent', '')"
    date: "$.get('date', '')"
    provider_event_id: "$.get('provider_event_id', '')"
    include_prematch_research: "$.get('include_prematch_research', True)"
    include_social_pulse: "$.get('include_social_pulse', False)"
  outputs:
    event_context: "$.get('event_context', {})"
    event_urn: "$.get('resolved_event_code', '') or $.get('event_urn', '')"
    resolved_fixture: "$.get('resolved_fixture', {})"
    status: "$.get('event_context_status', 'unavailable')"
    availability: "$.get('event_context_availability', {'event': 'unavailable', 'actions': 'unavailable', 'lineups': 'unavailable', 'team_statistics': 'unavailable', 'player_statistics': 'unavailable'})"
    evidence: "$.get('event_context_evidence', [])"
    provenance: "$.get('event_context_provenance', [])"
    warnings: "$.get('event_context_warnings', []) or ([] if ($.get('event_urn', '') or $.get('provider_event_id', '')) else ['No fixture resolved -- pass event_urn, provider_event_id, event (e.g. \\'Brazil vs Morocco\\'), or team (+ optional opponent/date). Use worldcup-get-schedule to list fixtures with their event_urn.'])"
    required_evidence: "$.get('event_context_required_evidence', [])"
    unavailable_reason: "$.get('event_context_unavailable_reason')"
    workflow-status: "$.get('event_context', {}) != {} and 'executed' or 'skipped'"
  tasks:
    - type: document
      name: resolve-load-events
      description: When no event_urn/provider_event_id is supplied, load cached events to resolve the fixture from event/team/opponent/date.
      condition: "$.get('event_urn', '') == '' and $.get('provider_event_id', '') == '' and ($.get('team', '') != '' or $.get('event', '') != '')"
      config:
        action: search
        search-limit: 500
        search-vector: false
      filters:
        name: "'worldcup:event'"
      outputs:
        resolve_events: "[d.get('value', {}) for d in ($.get('documents', []) or [])]"

    - type: connector
      name: resolve-fixture
      description: Filter cached events by event/team/opponent/date, then pin the matching event_urn.
      condition: "$.get('event_urn', '') == '' and $.get('provider_event_id', '') == '' and ($.get('team', '') != '' or $.get('event', '') != '')"
      connector:
        name: worldcup-market-intelligence
        command: normalize_schedule
      inputs:
        events: "$.get('resolve_events', [])"
        event: "$.get('event', '')"
        team: "$.get('team', '')"
        opponent: "$.get('opponent', '')"
        date_from: "$.get('date', '')"
        date_to: "$.get('date', '')"
        limit: 10
      outputs:
        resolved_fixture: "($.get('events', [{}]) or [{}])[0]"
        event_urn: "($.get('events', [{}]) or [{}])[0].get('event_urn', '')"

    - type: document
      name: lookup-event
      description: Lookup event context from the same pod document store. Requires an identifying input so an arbitrary event is never returned.
      condition: "$.get('event_urn', '') != '' or $.get('provider_event_id', '') != ''"
      config:
        action: search
        search-limit: 1
        search-vector: false
      filters:
        name: "'worldcup:event'"
        value._id: "$.get('event_urn') if $.get('event_urn') else {'$exists': True}"
        value.provider_ids.api_football: "$.get('provider_event_id') if $.get('provider_event_id') else {'$exists': True}"
      outputs:
        event_document: "($.get('documents', []) or [{}])[0]"
        source_event_document_id: "($.get('documents', []) or [{}])[0].get('_id', '')"
        resolved_event_code: "(($.get('documents', []) or [{}])[0].get('metadata', {}) or {}).get('event_code') or (((($.get('documents', []) or [{}])[0].get('value', {}) or {}).get('machina_sports_schema', {}) or {}).get('event_view', {}) or {}).get('event_id') or (($.get('documents', []) or [{}])[0].get('value', {}) or {}).get('_id') or (($.get('documents', []) or [{}])[0].get('value', {}) or {}).get('@id', '')"

    - type: document
      name: load-event-actions
      description: Load the latest actions projection bound to this exact canonical event document.
      condition: "$.get('resolved_event_code', '') != '' and $.get('source_event_document_id', '') != ''"
      config:
        action: search
        search-limit: 1
        search-vector: false
        search-sorters: [["metadata.observed_at", -1], ["_id", -1]]
      filters:
        name: "'api-football-event-actions'"
        metadata.event_code: "$.get('resolved_event_code')"
        metadata.source_event_document_id: "$.get('source_event_document_id')"
      outputs:
        actions_documents: "$.get('documents', [])"

    - type: document
      name: load-event-lineups
      description: Load the latest exact fixture-lineups projection; squad documents are never used.
      condition: "$.get('resolved_event_code', '') != '' and $.get('source_event_document_id', '') != ''"
      config:
        action: search
        search-limit: 1
        search-vector: false
        search-sorters: [["metadata.observed_at", -1], ["_id", -1]]
      filters:
        name: "'api-football-event-lineups'"
        metadata.event_code: "$.get('resolved_event_code')"
        metadata.source_event_document_id: "$.get('source_event_document_id')"
      outputs:
        lineups_documents: "$.get('documents', [])"

    - type: document
      name: load-event-team-statistics
      description: Load the latest team-statistics projection bound to this exact canonical event document.
      condition: "$.get('resolved_event_code', '') != '' and $.get('source_event_document_id', '') != ''"
      config:
        action: search
        search-limit: 1
        search-vector: false
        search-sorters: [["metadata.observed_at", -1], ["_id", -1]]
      filters:
        name: "'api-football-event-team-statistics'"
        metadata.event_code: "$.get('resolved_event_code')"
        metadata.source_event_document_id: "$.get('source_event_document_id')"
      outputs:
        team_statistics_documents: "$.get('documents', [])"

    - type: document
      name: load-event-player-statistics
      description: Load the latest player-statistics projection bound to this exact canonical event document.
      condition: "$.get('resolved_event_code', '') != '' and $.get('source_event_document_id', '') != ''"
      config:
        action: search
        search-limit: 1
        search-vector: false
        search-sorters: [["metadata.observed_at", -1], ["_id", -1]]
      filters:
        name: "'api-football-event-player-statistics'"
        metadata.event_code: "$.get('resolved_event_code')"
        metadata.source_event_document_id: "$.get('source_event_document_id')"
      outputs:
        player_statistics_documents: "$.get('documents', [])"

    - type: connector
      name: fetch-event-summary
      description: Optional Sports Skills football event summary if a provider event id is available.
      condition: "$.get('provider_event_id', '') != ''"
      continue_on_error: true
      connector:
        name: sports-skills
        command: invoke_football
      inputs:
        command: "'get_event_summary'"
        event_id: "$.get('provider_event_id')"
      outputs:
        sports_context: "$.get('data', {}) if $.get('status') else {}"

    - type: connector
      name: assemble-event-context
      description: Assemble canonical event identity with only latest exact-bound provider projections.
      connector:
        name: worldcup-market-intelligence
        command: assemble_event_context
      inputs:
        event_document: "$.get('event_document', {})"
        sports_context: "$.get('sports_context', {})"
        actions_documents: "$.get('actions_documents', [])"
        lineups_documents: "$.get('lineups_documents', [])"
        team_statistics_documents: "$.get('team_statistics_documents', [])"
        player_statistics_documents: "$.get('player_statistics_documents', [])"
      outputs:
        event_context: "$.get('event_context', {})"
        event_context_status: "$.get('status', 'unavailable')"
        event_context_availability: "$.get('availability', {})"
        event_context_evidence: "$.get('evidence', [])"
        event_context_provenance: "$.get('provenance', [])"
        event_context_warnings: "$.get('warnings', [])"
        event_context_required_evidence: "$.get('required_evidence', [])"
        event_context_unavailable_reason: "$.get('unavailable_reason')"

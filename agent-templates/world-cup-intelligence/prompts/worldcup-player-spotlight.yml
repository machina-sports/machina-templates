prompts:
  - type: prompt
    name: worldcup-player-spotlight
    title: World Cup Player Spotlight
    description: Author a structured, grounded spotlight card for a World Cup player.
    instruction: |
      Write a factual FIFA World Cup 2026 tournament spotlight for `player`, which is
      derived only from the persisted tournament squad identity record. Use ONLY facts
      present in that input. Never mention club contracts, club form, transfers,
      managers, or post-tournament events. Treat `position` as authoritative when it is
      present; never infer a different position. If a tournament fact is absent, omit it
      or say it is unavailable rather than filling it from general football knowledge.
      Neutral, informational tone. Always include the disclaimer.
    schema:
      title: WorldCupPlayerSpotlight
      type: object
      required: [headline, player_name, narrative, disclaimer]
      properties:
        headline:
          type: string
        player_name:
          type: string
        team:
          type: string
        position:
          type: string
        narrative:
          type: string
        performance_signals:
          type: object
          properties:
            role:
              type: string
            recent_contributions:
              type: string
            status:
              type: string
            note:
              type: string
        fixture_context:
          type: string
        disclaimer:
          type: string

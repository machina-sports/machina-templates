prompt:
  name: eval-judge-quality-prompt
  title: "Eval Judge - Output Quality"
  description: "Judges whether a workflow output faithfully and completely answers its input. Returns the eval verdict contract."
  tags:
    - eval
    - judge
  instruction: |
    You are a strict quality judge for an automated sports content workflow.
    The user message contains the workflow INPUT and the OUTPUT it produced.

    Decide whether the OUTPUT is acceptable:
    - "pass": it answers the input, stays faithful to it (no invented facts,
      names, scores or dates) and follows any format the input implies.
    - "fail": it invents facts, contradicts the input, is empty, or ignores
      the task.
    - "review": you cannot tell from the material given (for example the
      input is empty or truncated).

    Return:
    - verdict: one of pass | fail | review
    - score: a number from 0 to 1 (1 = clearly correct and faithful)
    - reason: one or two sentences, under 400 characters, citing what you checked
    - labels: up to 5 short tags such as "faithful", "invented-fact", "format"
  schema:
    type: object
    properties:
      verdict:
        type: string
        enum: ["pass", "fail", "review"]
      score:
        type: number
      reason:
        type: string
      labels:
        type: array
        items:
          type: string
    required: ["verdict", "score", "reason"]
  status: active

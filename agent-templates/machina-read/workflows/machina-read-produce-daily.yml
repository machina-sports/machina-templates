workflow:
  name: machina-read-produce-daily
  title: Machina Read - Best story of the day
  description: Native broad sports discovery and full ESPN reporting, Gemini story selection, bounded provider-ID-resolved
    Sports Skills and prediction-market research, Gemini explanatory writing, publication validation and native v4 document
    storage. No local runner or shadow collector. Manual/draft until activation approval.
  status: draft
  inputs:
    force_refresh: $.get('force_refresh', False) is True
    publish_public: $.get('publish_public', True) is True
  outputs:
    edition: $.get('read_cache', {}).get('edition', {}) if $.get('read_cache', {}).get('hit') else ($.get('read_final', {}).get('public',
      {}) if $.get('read_saved_id') and $.get('read_final', {}).get('edition', {}).get('publicApproved') is True else {})
    preview: $.get('read_final', {}).get('edition', {}) if $.get('read_saved_id') and $.get('read_final', {}).get('edition',
      {}).get('publicApproved') is False else {}
    document_id: $.get('read_cache', {}).get('documentId') or $.get('read_saved_id')
    served_from: '''cache'' if $.get(''read_cache'', {}).get(''hit'') else ''generated'''
    workflow-status: '''executed'' if $.get(''read_cache'', {}).get(''hit'') or $.get(''read_saved_id'') else ''failed'''
    health: $.get('read_health', {}).get('health', {})
  tasks:
  - type: connector
    name: edition-clock
    connector:
      name: machina-read-multisport
      command: initialize
    inputs: {}
    outputs:
      read_clock: $
  - type: document
    name: find-current-edition
    config:
      action: search
      search-limit: 1
      search-vector: false
      search-sorters:
      - - _id
        - -1
    filters:
      name: '''machina-read-edition'''
      value.schemaVersion: '4'
      value.publicApproved: 'True'
      metadata.edition_date: $.get('read_clock', {}).get('date')
    outputs:
      read_existing: '[] if $.context.get(''force_refresh'', False) is True else $.get(''documents'', [])'
  - type: connector
    name: check-native-cache
    connector:
      name: machina-read-multisport
      command: cached
    inputs:
      documents: $.get('read_existing', [])
      same_day: 'True'
      edition_format: '4'
    outputs:
      read_cache: $
  - type: document
    name: find-previous-published-editions
    config:
      action: search
      search-limit: 7
      search-vector: false
      search-sorters:
      - - _id
        - -1
    filters:
      name: '''machina-read-edition'''
      value.schemaVersion: '4'
      value.publicApproved: 'True'
    outputs:
      read_previous_documents: $.get('documents', [])
    condition: $.get('read_cache', {}).get('hit') is not True
  - type: connector
    name: collect-sport-schedule
    connector:
      name: sports-skills
      command: invoke_markets
    inputs:
      command: '''get_sport_schedule'''
      date: $.get('read_clock', {}).get('date')
    outputs:
      read_raw_schedule: $
    condition: $.get('read_cache', {}).get('hit') is not True
    continue_on_error: true
  - type: connector
    name: compact-sport-schedule
    connector:
      name: machina-read-multisport
      command: compact
    inputs:
      kind: '''schedule'''
      raw: $.get('read_raw_schedule', {})
    outputs:
      read_schedule: $
    condition: $.get('read_cache', {}).get('hit') is not True
    continue_on_error: true
  - type: connector
    name: collect-football-schedule
    connector:
      name: sports-skills

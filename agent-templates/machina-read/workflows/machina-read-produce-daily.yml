workflow:
  name: machina-read-produce-daily
  title: Machina Read - Cross-sport daily story
  description: Native multi-sport collection through sports-skills, Polymarket and Kalshi, pure compaction and cross-sport
    balancing, one Gemini call through machina-ai, publication validation and native v3 document storage. No local runner
    or shadow collector. Manual/draft until activation approval.
  status: draft
  inputs: {}
  outputs:
    edition: $.get('read_cache', {}).get('edition', {}) if $.get('read_cache', {}).get('hit') else ($.get('read_final', {}).get('public',
      {}) if $.get('read_saved_id') else {})
    document_id: $.get('read_cache', {}).get('documentId') or $.get('read_saved_id')
    served_from: '''cache'' if $.get(''read_cache'', {}).get(''hit'') else ''generated'''
    workflow-status: '''executed'' if $.get(''read_cache'', {}).get(''hit'') or $.get(''read_saved_id'') else ''failed'''
    health: $.get('read_health', {}).get('health', {})
  tasks:
  - type: connector
    name: edition-clock
    connector:
      name: machina-read-multisport
      command: initialize
    inputs: {}
    outputs:
      read_clock: $
  - type: document
    name: find-current-edition
    config:
      action: search
      search-limit: 1
      search-vector: false
      search-sorters:
      - - _id
        - -1
    filters:
      name: '''machina-read-edition'''
      value.schemaVersion: '3'
      value.publicApproved: 'True'
      metadata.edition_date: $.get('read_clock', {}).get('date')
    outputs:
      read_existing: $.get('documents', [])
  - type: connector
    name: check-native-cache
    connector:
      name: machina-read-multisport
      command: cached
    inputs:
      documents: $.get('read_existing', [])
      same_day: 'True'
    outputs:
      read_cache: $
  - type: connector
    name: collect-sport-schedule
    connector:
      name: sports-skills
      command: invoke_markets
    inputs:
      command: '''get_sport_schedule'''
      date: $.get('read_clock', {}).get('date')
    outputs:
      read_raw_schedule: $
    condition: $.get('read_cache', {}).get('hit') is not True
    continue_on_error: true
  - type: connector
    name: compact-sport-schedule
    connector:
      name: machina-read-multisport
      command: compact
    inputs:
      kind: '''schedule'''
      raw: $.get('read_raw_schedule', {})
    outputs:
      read_schedule: $
    condition: $.get('read_cache', {}).get('hit') is not True
    continue_on_error: true
  - type: connector
    name: collect-football-schedule
    connector:
      name: sports-skills
      command: invoke_football
    inputs:
      command: '''get_daily_schedule'''
      date: $.get('read_clock', {}).get('date')
    outputs:
      read_raw_football: $
    condition: $.get('read_cache', {}).get('hit') is not True
    continue_on_error: true
  - type: connector
    name: compact-football-schedule
    connector:
      name: machina-read-multisport
      command: compact
    inputs:
      kind: '''football'''
      raw: $.get('read_raw_football', {})
    outputs:
      read_football: $
    condition: $.get('read_cache', {}).get('hit') is not True
    continue_on_error: true
  - type: connector
    name: collect-tennis-atp
    connector:
      name: sports-skills
      command: invoke_tennis
    inputs:
      command: '''get_scoreboard'''
      tour: '''atp'''
      date: $.get('read_clock', {}).get('date')
    outputs:
      read_raw_tennis_atp: $
    condition: $.get('read_cache', {}).get('hit') is not True
    continue_on_error: true
  - type: connector
    name: compact-tennis-atp
    connector:
      name: machina-read-multisport
      command: compact
    inputs:
      kind: '''tennis'''
      raw: $.get('read_raw_tennis_atp', {})
      tour: '''atp'''
    outputs:

  - type: connector
    name: collect-polymarket-events
    connector:
      name: sports-skills
      command: invoke_polymarket
    inputs:
      command: '''get_sports_events'''
      limit: '20'
      active: 'True'
      closed: 'False'
    outputs:
      read_raw_polymarket: $
    condition: $.get('read_cache', {}).get('hit') is not True
    continue_on_error: true
  - type: connector
    name: compact-polymarket-events

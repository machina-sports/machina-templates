    continue_on_error: true
  - type: connector
    name: assemble-cross-sport-context
    connector:
      name: machina-read-multisport
      command: assemble
    inputs:
      schedule: $.get('read_schedule', {})
      football: $.get('read_football', {})
      tennis_atp: $.get('read_tennis_atp', {})
      tennis_wta: $.get('read_tennis_wta', {})
      polymarket: $.get('read_polymarket', {})
      kalshi: $.get('read_kalshi', {})
      news_football: $.get('read_news_football', {})
      news_americanfootball: $.get('read_news_americanfootball', {})
      news_baseball: $.get('read_news_baseball', {})
      news_basketball: $.get('read_news_basketball', {})
      news_hockey: $.get('read_news_hockey', {})
      news_tennis: $.get('read_news_tennis', {})
      news_motorsport: $.get('read_news_motorsport', {})
      news_golf: $.get('read_news_golf', {})
      news_cricket: $.get('read_news_cricket', {})
    outputs:
      read_context: $
    condition: $.get('read_cache', {}).get('hit') is not True
  - type: connector
    name: reason-across-sports
    connector:
      name: machina-ai
      command: invoke_chat
      provider: vertex_ai
      model: gemini-3.5-flash-lite
      profile: balanced
    inputs:
      prompt: $.get('read_context', {}).get('prompt')
      max_output_tokens: '4096'
      temperature: '0.3'
    outputs:
      read_model: $
    condition: $.get('read_cache', {}).get('hit') is not True and $.get('read_context', {}).get('status') == 'ready'
    continue_on_error: true
  - type: connector
    name: validate-generated-story
    connector:
      name: machina-read-multisport
      command: finalize
    inputs:
      context_pack: $.get('read_context', {})
      model_reply: $.get('read_model', {})
      publish_public: 'True'
    outputs:
      read_final: $
    condition: $.get('read_cache', {}).get('hit') is not True and $.get('read_context', {}).get('status') == 'ready'
  - type: document
    name: store-native-edition
    condition: $.get('read_cache', {}).get('hit') is not True and $.get('read_final', {}).get('status') == 'ready'
    config:
      action: save
      embed-vector: false
      force-update: false
    documents:
      machina-read-edition: $.get('read_final', {}).get('edition', {})
    metadata:
      edition_date: $.get('read_clock', {}).get('date')
      source: '''machina-read-native-v3'''
    outputs:
      read_saved_id: ($.get('documents', []) or [{}])[0].get('_id')
  - type: connector
    name: evaluate-refresh-health
    connector:
      name: machina-read-multisport
      command: health
    inputs:
      cache: $.get('read_cache', {})
      saved: $.get('read_saved_id')
      final: $.get('read_final', {})
      context: $.get('read_context', {})
    outputs:
      read_health: $
  - type: document
    name: record-refresh-health
    config:
      action: save
      embed-vector: false
      force-update: true
    filters:
      name: '''machina-read-health'''
    documents:
      machina-read-health: $.get('read_health', {}).get('health', {})

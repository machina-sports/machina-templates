    condition: $.get('read_cache', {}).get('hit') is not True
  - type: connector
    name: select-researchable-story
    connector:
      name: machina-ai
      command: invoke_chat
      provider: vertex_ai
      model: gemini-3.5-flash-lite
      profile: balanced
    inputs:
      prompt: $.get('read_context', {}).get('prompt')
      max_output_tokens: '2048'
      temperature: '0.1'
    outputs:
      read_selection_model: $
    condition: $.get('read_cache', {}).get('hit') is not True and $.get('read_context', {}).get('status') == 'ready'
    continue_on_error: true
  - type: connector
    name: plan-selected-research
    connector:
      name: machina-read-multisport
      command: plan_research
    inputs:
      context_pack: $.get('read_context', {})
      model_reply: $.get('read_selection_model', {})
    outputs:
      read_research_plan: $
    condition: $.get('read_cache', {}).get('hit') is not True and $.get('read_context', {}).get('status') == 'ready'
  - type: connector
    name: research-discovery-football
    connector: {name: sports-skills, command: invoke_football}
    foreach: {concurrent: false, name: research_item, expr: '$', value: '[item for item in $.get(''read_research_plan'', {}).get(''requests'', []) if item.get(''module'') == ''football'']'}
    inputs: &research-inputs
      command: $.get('research_item', {}).get('command')
      date: $.get('research_item', {}).get('date')
      season: $.get('research_item', {}).get('season')
      season_year: $.get('research_item', {}).get('season_year')
      season_type: $.get('research_item', {}).get('season_type')
      team_id: $.get('research_item', {}).get('team_id')
      event_id: $.get('research_item', {}).get('event_id')
      query: $.get('research_item', {}).get('query')
      tour: $.get('research_item', {}).get('tour')
      series_id: $.get('research_item', {}).get('series_id')
      sport: $.get('research_item', {}).get('sport')
    outputs:
      read_discovery_football: '[{''request'': $.context.get(''research_item'', {}), ''response'': response}]'
    condition: $.get('read_cache', {}).get('hit') is not True and $.get('read_research_plan', {}).get('status') == 'ready'
    continue_on_error: true
  - type: connector
    name: research-discovery-nfl
    connector: {name: sports-skills, command: invoke_nfl}

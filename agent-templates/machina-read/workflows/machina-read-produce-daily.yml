      news_golf: $.get('read_news_golf', {})
      news_cricket: $.get('read_news_cricket', {})
      reporting_football: $.get('read_reporting_football', {})
      reporting_americanfootball: $.get('read_reporting_americanfootball', {})
      reporting_baseball: $.get('read_reporting_baseball', {})
      reporting_basketball: $.get('read_reporting_basketball', {})
      reporting_hockey: $.get('read_reporting_hockey', {})
      reporting_tennis: $.get('read_reporting_tennis', {})
      reporting_motorsport: $.get('read_reporting_motorsport', {})
      reporting_golf: $.get('read_reporting_golf', {})
      reporting_cricket: $.get('read_reporting_cricket', {})
    outputs:

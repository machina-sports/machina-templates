agent:
  name: machina-read-daily
  title: Machina Read - Daily best story
  description: Select and produce one validated best sports story each day using native workflows; consumers only read the stored result.
  status: inactive
  jobs:
    - name: machina-read-refresh
      type: agent
      target: machina-read-daily
      interval: 43200
      enabled: false
      context: {}
  context:
    status: inactive
  context-variables: {}
  workflows:
    - name: machina-read-produce-daily
      inputs: {}
      outputs:
        edition: "$.get('edition', {})"
        served_from: "$.get('served_from')"
        workflow-status: "$.get('workflow-status')"
        read_health: "$.get('health', {})"

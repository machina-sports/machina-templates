      sha256: b6e8816ce5e7a83c171a37113d9eafdae432a5fc870e12cfc10daed884163861
      title: scripts/validate_params.sh
      value: |
        #!/bin/bash
        # Validates tennis-data parameters
        if [[ "$*" == *"--tour="* ]]; then
          TOUR=$(echo "$*" | grep -o '\-\-tour=[^ ]*' | cut -d= -f2)
          if [[ "$TOUR" != "atp" && "$TOUR" != "wta" ]]; then
            echo "ERROR: --tour must be 'atp' or 'wta'. Got: $TOUR"
            exit 1
          fi
        fi
        echo "OK"

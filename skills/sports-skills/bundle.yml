        | NFL | `nfl` | KXNFL |
        | MLB | `mlb` | KXMLB |
        | NHL | `nhl` | KXNHL |
        | WNBA | `wnba` | KXWNBA |
        | College Football | `cfb` | KXCFB |
        | College Basketball | `cbb` | KXCBB |

        ### Football (Soccer)

        | League | Code | Series Tickers |

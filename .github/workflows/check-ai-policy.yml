name: Check AI routing policy and command inventory

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PyYAML powers the semantic router-policy pass; the line scan alone
      # can be dodged with quoted keys or flow-style YAML.
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Check Machina AI routing policy
        run: python scripts/check-machina-ai-policy.py all --require-semantic
      - name: Check AI command inventory
        run: python scripts/check-ai-command-inventory.py

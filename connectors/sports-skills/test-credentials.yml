workflow:
  name: "sports-skills-test-credentials"
  title: "Sports Skills — Smoke Test"
  description: "Validates that the sports-skills Python package is reachable from the pod runtime and is serving live data. Calls football.get_competitions (no API key required) and fails unless the returned list is non-empty and every competition carries a well-formed, non-estimated current_season."
  context-variables:
    debugger:
      enabled: false
  inputs: {}
  outputs:
    competitions: "$.get('competitions', [])"
    # A total ESPN outage still yields the full static competition list, but
    # every current_season degrades to a placeholder carrying estimated=true.
    # Naming those is what separates a real green from a false one.
    #
    # A competition counts as degraded when it is not a dict, when its
    # current_season is missing/null/not a dict, or when that season is
    # estimated. Every guard is an isinstance check so a malformed payload
    # (an error envelope where the list should be, a bare string entry)
    # resolves to `failed` instead of raising and being laundered into a
    # verdict by the engine's except-handler. Outputs cannot reference one
    # another — the engine evaluates each against workflow state — so the
    # predicate is repeated verbatim across the three expressions below.
    degraded-competition-ids: "[(c.get('id') or '<unknown-id>') if isinstance(c, dict) else '<malformed-entry>' for c in ($.get('competitions') if isinstance($.get('competitions'), list) else []) if not isinstance(c, dict) or not isinstance(c.get('current_season'), dict) or c.get('current_season').get('estimated')]"
    degraded-competition-count: "len([c for c in ($.get('competitions') if isinstance($.get('competitions'), list) else []) if not isinstance(c, dict) or not isinstance(c.get('current_season'), dict) or c.get('current_season').get('estimated')])"
    workflow-status: "'executed' if (len($.get('competitions') if isinstance($.get('competitions'), list) else []) > 0 and not [c for c in ($.get('competitions') if isinstance($.get('competitions'), list) else []) if not isinstance(c, dict) or not isinstance(c.get('current_season'), dict) or c.get('current_season').get('estimated')]) else 'failed'"
  tasks:
    - type: "connector"
      name: "smoke-football-get-competitions"
      description: "Call sports_skills.football.get_competitions() — zero-config call; every competition it returns must carry a live current_season."
      connector:
        name: "sports-skills"
        command: "invoke_football"
      inputs:
        command: "'get_competitions'"
      outputs:
        # The package wraps responses as `{"competitions": [...]}`, and the
        # connector envelope wraps that as `{"data": {"competitions": [...]}}`.
        # Reach for the inner list directly.
        competitions: "$.get('data', {}).get('competitions', [])"

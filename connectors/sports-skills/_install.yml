setup:
  title: Sports Skills
  description: Aggregator over sports-data domains via the machina-sports/sports-skills Python package — football, major US leagues, individual sports, Polymarket/Kalshi, keyless read-only ProphetX, betting utilities, cross-sportsbook market matching, and news.
  category:
    - data-acquisition
    - sports
  estimatedTime: 1 minute
  features:
    - Football (soccer) — standings, schedules, lineups, xG, transfers, player profiles across 13 leagues
    - NBA, WNBA, NFL, NHL, MLB, CFB, CBB — scoreboards, schedules, standings, boxscores
    - Tennis, golf, F1, volleyball, XCTF — schedules, results, leaders
    - Cricket — ESPN live/standings + Cricsheet ball-by-ball deliveries
    - Esports — OpenDota (Dota 2) and Leaguepedia (LoL) pro matches, teams, tournaments
    - Polymarket and Kalshi prediction markets, plus ProphetX keyless public read-only market data
    - Betting utilities — odds conversion, devig, Kelly criterion, arbitrage, parlay analysis
    - Cross-sportsbook market matching and normalization
    - Sports news aggregation
  integrations:
    - sports-skills
  status: available
  value: connectors/sports-skills
  version: 0.1.0

datasets:
  - type: connector
    path: sports-skills.yml

  - type: workflow
    path: test-credentials.yml

connector:
  name: machina-read-multisport
  description: Pure multi-sport evidence compaction, bounded best-story selection and research planning,
    provider-ID joins, researched-brief construction and publication validation for native Machina Read v4,
    with explicit v3 compatibility. No I/O or orchestration.
  filename: machina-read-multisport.py
  filetype: pyscript
  commands:
  - name: Initialize
    value: initialize
  - name: Cached
    value: cached
  - name: Compact
    value: compact
  - name: Assemble
    value: assemble
  - name: Plan research
    value: plan_research
  - name: Resolve research
    value: resolve_research
  - name: Build research brief
    value: build_research_brief
  - name: Finalize
    value: finalize
  - name: Health
    value: health

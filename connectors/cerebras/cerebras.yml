connector:
  name: "cerebras"
  description: "Cerebras public chat inference with a fixed endpoint, runtime-owned credentials, and an operator-owned model allowlist."
  filename: "cerebras.py"
  filetype: "pyscript"
  commands:
    - name: "Prompt model"
      value: "invoke_prompt"
    - name: "Chat completion"
      value: "invoke_chat"
    - name: "List models"
      value: "list_models"
    - name: "Health"
      value: "health"
    - name: "Completion receipt"
      value: "completion_receipt"

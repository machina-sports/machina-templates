workflow:
  name: "cerebras-test-credentials"
  title: "Cerebras - Test Credentials"
  description: "Safe receipt proving the configured public model serves a small chat completion."
  context-variables:
    debugger:
      enabled: true
    cerebras:
      api_key: $TEMP_CONTEXT_VARIABLE_CEREBRAS_API_KEY
  outputs:
    completion: "$.get('completion', {})"
    workflow-status: "$.get('workflow-status', 'skipped')"
  tasks:
    - type: connector
      name: cerebras-completion-receipt-task
      description: Execute a bounded completion without exposing the credential.
      connector:
        name: cerebras
        command: completion_receipt
      outputs:
        completion: "$.get('data', {})"
        workflow-status: "'executed' if $.get('data', {}).get('completed', False) else 'failed'"

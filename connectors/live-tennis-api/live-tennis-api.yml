connector:
  name: "live-tennis-api"
  description: "Live Tennis API (livetennisapi.com) — read-only live in-match state, scores, fixtures, players, tournaments, rankings and head-to-head for ATP, WTA, Challenger, ITF and juniors. Contributed by the vendor. Requires an API key supplied through the Machina vault as TEMP_CONTEXT_VARIABLE_LIVE_TENNIS_API_KEY; never committed. FREE tier: 30 req/min, 100 req/day. No retries, no writes, no odds placement."
  filename: "live-tennis-api.py"
  filetype: "pyscript"
  commands:
    - name: "Usage vs quota (credential check, FREE)"
      value: "get_usage"
    - name: "Live matches with break-point flag (FREE)"
      value: "get_live_matches"
    - name: "Matches by status / date / tour (FREE; completed+cancelled BASIC)"
      value: "get_matches"
    - name: "One match (FREE)"
      value: "get_match"
    - name: "One match score, lowest latency (FREE)"
      value: "get_match_score"
    - name: "Upcoming fixtures (FREE)"
      value: "get_fixtures"
    - name: "Search players by name (FREE)"
      value: "search_players"
    - name: "One player (FREE)"
      value: "get_player"
    - name: "Tournament catalogue (FREE)"
      value: "get_tournaments"
    - name: "Rankings and Elo (PRO / ULTRA)"
      value: "get_rankings"
    - name: "Head-to-head (BASIC)"
      value: "get_head_to_head"
    - name: "Derive break-point state from a score (offline, no API call)"
      value: "derive_match_state"
    - name: "Generic read-only GET (allow-listed paths)"
      value: "invoke_request"

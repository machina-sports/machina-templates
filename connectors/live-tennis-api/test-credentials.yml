workflow:
  name: "live-tennis-api-test-credentials"
  title: "Live Tennis API - Test Credentials"
  description: "Checks the vault key against GET /usage (FREE on every tier, one request): returns the principal, tier and quota so a wrong or disabled key fails here rather than inside a scheduled workflow."
  context-variables:
    debugger:
      enabled: true
    live-tennis-api:
      api_key: $TEMP_CONTEXT_VARIABLE_LIVE_TENNIS_API_KEY
  outputs:
    result: "$.get('test_result', {})"
    workflow-status: "$.get('workflow-status', 'skipped')"
  tasks:

    - type: connector
      name: live-tennis-api-test-credentials-task
      description: Test credentials by reading the key's own usage record.
      connector:
        name: live-tennis-api
        command: get_usage
      inputs:
        api_key: "$.get('api_key')"
      outputs:
        # The connector returns {status, data: {usage: {...}}}; the engine
        # exposes the `data` keys directly, so `usage` is reachable as $.get('usage').
        test_result: |
          {
            'status': 'success' if isinstance($.get('usage'), dict) and $.get('usage', {}).get('tier') else 'error',
            'tier': ($.get('usage') or {}).get('tier'),
            'limits': ($.get('usage') or {}).get('limits'),
            'today': ($.get('usage') or {}).get('today'),
            'message': $.get('message')
          }
        workflow-status: "'executed' if isinstance($.get('usage'), dict) and $.get('usage', {}).get('tier') else 'failed'"

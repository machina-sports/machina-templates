workflow:

  # api-football-get-fixtures
  name: "api-football-get-fixtures"
  title: "API Football - Get Fixtures"
  description: "Comprehensive workflow to get fixtures from API Football with support for single/multiple IDs, live fixtures, date ranges, league/team filtering, and venue-specific queries."
  context-variables:
    debugger:
      enabled: true
    api-football:
      x-apisports-key: "$TEMP_CONTEXT_VARIABLE_API_FOOTBALL_API_KEY"
  inputs:
    id: "$.get('id')"
    ids: "$.get('ids')"
    live: "$.get('live')"
    league: "$.get('league')"
    season: "$.get('season')"
    date: "$.get('date')"
    team: "$.get('team')"
    last: "$.get('last')"
    next: "$.get('next')"
    from: "$.get('from')"
    to: "$.get('to')"
    round: "$.get('round')"
    status: "$.get('status')"
    venue: "$.get('venue')"
    timezone: "$.get('timezone')"
  outputs:
    response: "$.get('provider-response', [])"
    errors: "$.get('provider-errors', [])"
    results: "$.get('provider-results')"
    workflow-status: "'executed' if $.get('provider-response-valid', False) and not $.get('provider-errors', []) else 'failed'"
  tasks:

    - type: "connector"
      name: "api-football-get-fixtures"
      description: "Get fixtures from API Football."
      connector:
        name: "api-football"
        command: "get-fixtures"
      inputs:
        id: "$.get('id')"
        ids: "$.get('ids')"
        live: "$.get('live')"
        league: "$.get('league')"
        season: "$.get('season')"
        date: "$.get('date')"
        team: "$.get('team')"
        last: "$.get('last')"
        next: "$.get('next')"
        from: "$.get('from')"
        to: "$.get('to')"
        round: "$.get('round')"
        status: "$.get('status')"
        venue: "$.get('venue')"
        timezone: "$.get('timezone')"
      outputs:
        provider-response: "$.get('response', [])[:100] if isinstance($.get('response'), list) else []"
        provider-errors: "{str(key)[:100]: str(value)[:500] for key, value in list($.get('errors', {}).items())[:20]} if isinstance($.get('errors'), dict) else [str(item)[:500] for item in $.get('errors', [])[:20]] if isinstance($.get('errors'), list) else [str($.get('errors'))[:500]] if $.get('errors') else []"
        provider-results: "$.get('results') if isinstance($.get('results'), int) and not isinstance($.get('results'), bool) else None"
        provider-response-valid: "isinstance($.get('response'), list) and isinstance($.get('errors'), (list, dict)) and isinstance($.get('results'), int) and not isinstance($.get('results'), bool) and $.get('results') >= 0 and $.get('results') == len($.get('response'))"

workflow:

  # api-football-event-synchronize
  name: api-football-event-synchronize
  title: API Football - Event Synchronize
  description: Workflow to synchronize a soccer game from API Football by event code.
  context-variables:
    debugger:
      enabled: false
    google-genai:
      credential: $TEMP_CONTEXT_VARIABLE_VERTEX_AI_CREDENTIAL
      project_id: $TEMP_CONTEXT_VARIABLE_VERTEX_AI_PROJECT_ID
    api-football:
      x-apisports-key: $TEMP_CONTEXT_VARIABLE_API_FOOTBALL_API_KEY
  inputs:
    event_document_id: $.get('event_document_id')
  outputs:
    workflow-status: "'executed' if $.get('event_updated') is not None else ('skipped' if $.get('event_exists') is not True or ($.get('provider-response-valid', False) and not $.get('provider-errors', []) and not $.get('fixture_exists', False)) else 'failed')"
  tasks:

    # load-event-by-id
    - type: document
      name: load-event-by-id
      description: Search event (api-football) by document id.
      condition: $.get('event_document_id') is not None
      config:
        action: search
        search-limit: 1
        search-vector: false
        search-sorters: ["value.schema:startDate", 1]
      filters:
        document_id: $.get('event_document_id')
      outputs:
        event_exists: len($.get('documents', [])) > 0
        event_value: $.get('documents', [])[0].get('value', {}) if $.get('documents') else None

    # resolve-provider-fixture-id
    - type: connector
      name: resolve-provider-fixture-id
      description: Resolve exactly one API-Football fixture id from the canonical event crosswalk.
      condition: $.get('event_exists') is True
      connector:
        name: api-football-event-data
        command: resolve_provider_fixture_id
      inputs:
        event_document_value: $.get('event_value', {})
      outputs:
        provider_fixture_id: $.get('provider_fixture_id')

    # fetch-fixture-details
    - type: connector
      name: fetch-fixture-details
      description: Get fixture details from API Football
      condition: $.get('provider_fixture_id') is not None
      connector:
        name: api-football
        command: get-fixtures
      inputs:
        id: $.get('provider_fixture_id')
      outputs:
        provider-errors: "{str(key)[:100]: str(value)[:500] for key, value in list($.get('errors', {}).items())[:20]} if isinstance($.get('errors'), dict) else [str(item)[:500] for item in $.get('errors', [])[:20]] if isinstance($.get('errors'), list) else [str($.get('errors'))[:500]] if $.get('errors') else []"
        provider-response-valid: "isinstance($.get('response'), list) and isinstance($.get('errors'), (list, dict)) and isinstance($.get('results'), int) and not isinstance($.get('results'), bool) and $.get('results') in (0, 1) and $.get('results') == len($.get('response'))"
        fixture_data: "$.get('response', [])[0] if isinstance($.get('response'), list) and len($.get('response')) > 0 else {}"
        fixture_exists: "isinstance($.get('response'), list) and len($.get('response')) == 1 and isinstance($.get('response', [])[0], dict) and isinstance($.get('response', [])[0].get('fixture'), dict) and $.get('response', [])[0].get('fixture', {}).get('id') is not None and $.get('response', [])[0].get('fixture', {}).get('id') == $.get('provider_fixture_id')"

    # iptc-api-football-event-mapping
    - type: mapping
      name: iptc-api-football-event-mapping
      title: IPTC | API Football Event Mapping
      description: Mapping data from api-football to IPTC events
      condition: "$.get('provider-response-valid', False) and not $.get('provider-errors', []) and $.get('fixture_exists') is True"
      inputs:
        fixtures: |
          [
            $.get('fixture_data', {})
          ]
      outputs:
        event_updated: $.get('sport_schema_events', [])[0] if $.get('sport_schema_events', []) else None
        event_updated_ids: |
          [str(f.get('@id', '')) for f in $.get('sport_schema_events', [])]

    # version-control-update
    - type: document
      name: version-control-update
      description: Update the events document with synchronized data.
      condition: "$.get('event_exists') is True and $.get('provider-response-valid', False) and not $.get('provider-errors', []) and $.get('fixture_exists') is True and isinstance($.get('event_updated'), dict)"
      config:
        action: update
        embed-vector: false
        force-update: true
      filters:
        document_id: $.get('event_document_id')
      documents:
        sport:Event: |
          {
            **$.get('event_value', {}),
            **$.get('event_updated', {}),
            'version_control': {
              **$.get('event_value', {}).get('version_control', {})
            }
          }

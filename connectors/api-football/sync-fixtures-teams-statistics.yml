workflow:

  # api-football-sync-teams-statistics
  name: "api-football-sync-fixtures-teams-statistics"
  title: "API Football - Sync Fixtures Teams Statistics"
  description: "Workflow to sync fixtures statistics from API Football with detailed team performance data."
  context-variables:
    debugger:
      enabled: true
    api-football:
      x-apisports-key: "$TEMP_CONTEXT_VARIABLE_API_FOOTBALL_API_KEY"
    google-genai:
      credential: $TEMP_CONTEXT_VARIABLE_VERTEX_AI_CREDENTIAL
      project_id: $TEMP_CONTEXT_VARIABLE_VERTEX_AI_PROJECT_ID
  inputs:
    fixture: "$.get('fixture')"
  outputs:
    workflow-status: "'failed' if not $.get('provider-response-valid', False) or $.get('provider-errors', []) else ('executed' if $.get('statistics-count', 0) > 0 and len($.get('iptc_teams_statistics', {}).get('sport:participation', [])) > 0 else 'unavailable')"
  tasks:

    # iptc-api-football-id-conversion-mapping
    - type: mapping
      name: iptc-api-football-id-conversion-mapping
      title: "IPTC | API Football ID Conversion Mapping"
      description: "Convert IPTC URN IDs to original API Football IDs"
      condition: "$.get('fixture') is not None"
      inputs:
        iptc_schema_events: "[{'@id': $.get('fixture')}]"
      outputs:
        original_fixture_id: "$.get('original_ids', [''])[0]"
        iptc_schema_id: "$.get('iptc_schema_ids', [''])[0]"

    # api-football-get-fixtures-statistics
    - type: "connector"
      name: "api-football-get-fixtures-statistics"
      description: "Get fixtures statistics from API Football."
      connector:
        name: "api-football"
        command: "get-fixtures/statistics"
      inputs:
        fixture: "$.get('original_fixture_id', $.get('fixture'))"
      outputs:
        provider-errors: "{str(key)[:100]: str(value)[:500] for key, value in list($.get('errors', {}).items())[:20]} if isinstance($.get('errors'), dict) else [str(item)[:500] for item in $.get('errors', [])[:20]] if isinstance($.get('errors'), list) else [str($.get('errors'))[:500]] if $.get('errors') else []"
        provider-response-valid: "isinstance($.get('response'), list) and isinstance($.get('errors'), (list, dict)) and isinstance($.get('results'), int) and not isinstance($.get('results'), bool) and $.get('results') == len($.get('response'))"
        fixtures-statistics: "$.get('response', []) if isinstance($.get('response'), list) else []"
        statistics-count: "len($.get('response', [])) if isinstance($.get('response'), list) else 0"
        fixture-team-home-name: "next((row.get('team', {}).get('name', 'Unknown') for index, row in enumerate($.get('response', [])) if index == 0 and isinstance(row, dict)), 'Unknown') if isinstance($.get('response'), list) else 'Unknown'"
        fixture-team-away-name: "next((row.get('team', {}).get('name', 'Unknown') for index, row in enumerate($.get('response', [])) if index == 1 and isinstance(row, dict)), 'Unknown') if isinstance($.get('response'), list) else 'Unknown'"

    # iptc-api-football-event-teams-stats
    - type: mapping
      name: iptc-api-football-event-teams-stats
      title: "Convert to IPTC Event Teams Statistics"
      description: "Convert API Football statistics to IPTC Soccer Statistics format"
      condition: "$.get('provider-response-valid', False) and not $.get('provider-errors', []) and len($.get('fixtures-statistics', [])) > 0"
      inputs:
        fixtures_statistics: "$.get('fixtures-statistics', [])"
        fixture: "$.get('original_fixture_id', $.get('fixture'))"
        fixture_team_home_name: "$.get('fixture-team-home-name')"
        fixture_team_away_name: "$.get('fixture-team-away-name')"
      outputs:
        iptc_teams_statistics: "$.get('iptc_teams_statistics', {})"

    # task-bulk-save-fixtures-teams-statistics
    - type: "document"
      name: "task-bulk-save-fixtures-teams-statistics"
      description: "Bulk save the individual fixtures teams statistics."
      condition: "$.get('provider-response-valid', False) and not $.get('provider-errors', []) and len($.get('iptc_teams_statistics', {}).get('sport:participation', [])) > 0"
      config:
        action: "bulk-update"
        embed-selector: "$.get('title')"
        embed-vector: true
        force-update: true
      connector:
        name: "google-genai"
        command: "invoke_embedding"
        model: "text-embedding-004"
        location: "global"
        provider: "vertex_ai"
      document_name: "'sport:TeamParticipation'"
      documents:
        items: |
          [
            {
              **f,
              'metadata': {
                'action_code': str(f.get('@id', '')),
                'document_type': 'sport:IndividualParticipation',
                'event_code': '$.(iptc_schema_id)',
                'team_code': f.get('sport:participationBy', {}).get('@id', '')
              },
              'title': f.get('rdfs:label', '')
            }
            for f in $.get('iptc_teams_statistics', []).get('sport:participation', [])
          ]

workflow:

  # api-football-sync-teams-statistics
  name: "api-football-sync-teams-statistics"
  title: "API Football - Sync Teams Statistics"
  description: "Workflow to sync teams statistics from API Football with detailed team performance data."
  context-variables:
    debugger:
      enabled: true
    api-football:
      x-apisports-key: "$TEMP_CONTEXT_VARIABLE_API_FOOTBALL_API_KEY"
  inputs:
    league: "$.get('league')"
    team: "$.get('team')"
    season: "$.get('season')"
    date: "$.get('date')"
  outputs:
    workflow-status: "'executed'"
  tasks:

    - type: "connector"
      name: "api-football-get-teams-statistics"
      description: "Get teams statistics from API Football."
      connector:
        name: "api-football"
        command: "get-teams/statistics"
      inputs:
        league: "$.get('league')"
        team: "$.get('team')"
        season: "$.get('season')"
        date: "$.get('date')"
      outputs:
        teams-statistics: "$.get('response')"
        team-name: "$.get('response', {}).get('team', {}).get('name', 'Unknown')"
        league-name: "$.get('response', {}).get('league', {}).get('name', 'Unknown')"

    # task-lookup-teams-statistics
    - type: "document"
      name: "task-lookup-teams-statistics"
      description: "Find this team's existing season statistics document."
      config:
        action: "search"
        search-limit: 1
        search-vector: false
      filters:
        name: "'teams-statistics'"
        metadata.team_id: "str($.get('team'))"
        metadata.league_id: "str($.get('league'))"
        metadata.season: "str($.get('season'))"
      outputs:
        existing-statistics-id: "($.get('documents', []) or [{}])[0].get('_id')"

    # task-update-teams-statistics
    - type: "document"
      name: "task-update-teams-statistics"
      description: "Create the teams statistics document when none exists yet."
      condition: "$.get('existing-statistics-id') is None"
      config:
        action: "save"
        embed-vector: false
      documents:
        teams-statistics: |
          {
            'data': $.get('teams-statistics', {}),
            'title': f"{$.get('league-name')} - {$.get('team-name')} - {$.get('season', 'Unknown')}",
            'execution': datetime.utcnow(),
            'status': 'active',
            'parameters': {
              'league': $.get('league'),
              'team': $.get('team'),
              'season': $.get('season'),
              'date': $.get('date')
            }
          }
      metadata: &teams-statistics-metadata
        document_type: "'team-statistics'"
        team_id: "str($.get('team'))"
        league_id: "str($.get('league'))"
        season: "str($.get('season'))"
        team_name: "$.get('team-name', 'Unknown')"
        league_name: "$.get('league-name', 'Unknown')"
        status: "'available'"
        # Consumers admit season form as verified provider fact only when the
        # document says who observed it and when, and that it was not invented.
        provenance: |
          {
            'provider': 'api-football',
            'synthetic': False,
            'observed_at': datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
          }

    # task-refresh-teams-statistics
    - type: "document"
      name: "task-refresh-teams-statistics"
      description: "Refresh the existing season statistics document in place."
      condition: "$.get('existing-statistics-id') is not None"
      config:
        action: "update"
        embed-vector: false
        force-update: true
      filters:
        document_id: "$.get('existing-statistics-id')"
      documents:
        teams-statistics: |
          {
            'data': $.get('teams-statistics', {}),
            'title': f"{$.get('league-name')} - {$.get('team-name')} - {$.get('season', 'Unknown')}",
            'execution': datetime.utcnow(),
            'status': 'active',
            'parameters': {
              'league': $.get('league'),
              'team': $.get('team'),
              'season': $.get('season'),
              'date': $.get('date')
            }
          }
      metadata: *teams-statistics-metadata

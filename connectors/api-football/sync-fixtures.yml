workflow:

  # api-football-sync-fixtures
  name: "api-football-sync-fixtures"
  title: "API Football - Sync Fixtures"
  description: "Comprehensive workflow to sync fixtures from API Football with support for single/multiple IDs, live fixtures, date ranges, league/team filtering, and venue-specific queries."
  context-variables:
    debugger:
      enabled: true
    api-football:
      x-apisports-key: "$TEMP_CONTEXT_VARIABLE_API_FOOTBALL_API_KEY"
    google-genai:
      credential: $TEMP_CONTEXT_VARIABLE_VERTEX_AI_CREDENTIAL
      project_id: $TEMP_CONTEXT_VARIABLE_VERTEX_AI_PROJECT_ID
  inputs:
    id: "$.get('id')"
    ids: "$.get('ids')"
    live: "$.get('live')"
    league: "$.get('league')"
    season: "$.get('season')"
    date: "$.get('date')"
    team: "$.get('team')"
    last: "$.get('last')"
    next: "$.get('next')"
    from: "$.get('from')"
    to: "$.get('to')"
    round: "$.get('round')"
    status: "$.get('status')"
    venue: "$.get('venue')"
    timezone: "$.get('timezone')"
    observed_at: "$.get('observed_at', datetime.utcnow().isoformat() + '+00:00')"
  outputs:
    errors: "$.get('provider-errors', [])"
    results: "$.get('provider-results')"
    workflow-status: "'failed' if not $.get('provider-response-valid', False) or $.get('provider-errors', []) or (len($.get('provider-fixtures', [])) > 0 and (not isinstance($.get('fixtures'), list) or len($.get('fixtures', [])) != len($.get('provider-fixtures', [])) or len($.get('canonical-envelopes', [])) != len($.get('provider-fixtures', [])) or len($.get('canonical-envelope-validity', [])) != len($.get('provider-fixtures', [])) or not all($.get('canonical-envelope-validity', [])))) else ('skipped' if len($.get('provider-fixtures', [])) == 0 else 'executed')"
  tasks:

    - type: "connector"
      name: "api-football-get-fixtures"
      description: "Get fixtures from API Football."
      connector:
        name: "api-football"
        command: "get-fixtures"
      inputs:
        id: "$.get('id')"
        ids: "$.get('ids')"
        live: "$.get('live')"
        league: "$.get('league')"
        season: "$.get('season')"
        date: "$.get('date')"
        team: "$.get('team')"
        last: "$.get('last')"
        next: "$.get('next')"
        from: "$.get('from')"
        to: "$.get('to')"
        round: "$.get('round')"
        status: "$.get('status')"
        venue: "$.get('venue')"
        timezone: "$.get('timezone')"
      outputs:
        provider-fixtures: "$.get('response', []) if isinstance($.get('response'), list) else []"
        provider-errors: "{str(key)[:100]: str(value)[:500] for key, value in list($.get('errors', {}).items())[:20]} if isinstance($.get('errors'), dict) else [str(item)[:500] for item in $.get('errors', [])[:20]] if isinstance($.get('errors'), list) else [str($.get('errors'))[:500]] if $.get('errors') else []"
        provider-results: "$.get('results') if isinstance($.get('results'), int) and not isinstance($.get('results'), bool) else None"
        provider-response-valid: "isinstance($.get('response'), list) and isinstance($.get('errors'), (list, dict)) and isinstance($.get('results'), int) and not isinstance($.get('results'), bool) and $.get('results') >= 0 and $.get('results') == len($.get('response'))"

    # canonicalize-fixtures
    - type: connector
      name: canonicalize-fixtures
      description: "Canonicalize each provider fixture and retain its provenance and rights envelope."
      condition: "$.get('provider-response-valid', False) and not $.get('provider-errors', []) and len($.get('provider-fixtures', [])) > 0"
      foreach:
        limit: 1000
        name: provider-fixture
        expr: $
        value: "$.get('provider-fixtures', [])"
      connector:
        name: machina-sports-canonical
        command: canonicalize_event
      inputs:
        provider: "'api-football'"
        consumer_tier: "'prototype'"
        requires: "['event.identity', 'event.competition', 'event.participants', 'event.start_time', 'event.status', 'provenance']"
        optional: "['event.score']"
        observed_at: "$.get('observed_at')"
        payload: "$.get('provider-fixture', {})"
      outputs:
        canonical-envelopes: "[$.get('envelope', {})]"
        canonical-envelope-validity: "[isinstance($.get('envelope'), dict) and isinstance($.get('envelope', {}).get('machina_sports_schema'), dict) and $.get('envelope', {}).get('machina_sports_schema', {}).get('provenance', {}).get('provider', {}).get('namespace') == 'api-football' and $.get('envelope', {}).get('machina_sports_schema', {}).get('provenance', {}).get('provider', {}).get('family') == 'licensed' and $.get('envelope', {}).get('machina_sports_schema', {}).get('rights', {}).get('data_class') == 'licensed-provider-example-fixture' and $.get('envelope', {}).get('machina_sports_schema', {}).get('rights', {}).get('prototype_only') is True and $.get('envelope', {}).get('machina_sports_schema', {}).get('rights', {}).get('commercial_use') is False]"

    # iptc-api-football-event-mapping
    - type: mapping
      name: iptc-api-football-event-mapping
      title: "IPTC | API Football Event Mapping"
      description: "Mapping data from api-football to IPTC events"
      condition: "$.get('provider-response-valid', False) and not $.get('provider-errors', []) and len($.get('provider-fixtures', [])) > 0 and len($.get('canonical-envelopes', [])) == len($.get('provider-fixtures', [])) and len($.get('canonical-envelope-validity', [])) == len($.get('provider-fixtures', [])) and all($.get('canonical-envelope-validity', []))"
      inputs:
        fixtures: "$.get('provider-fixtures', [])"
      outputs:
        fixtures: "$.get('sport_schema_events')"

    # task-bulk-save-fixtures
    - type: "document"
      name: "task-bulk-save-fixtures"
      description: "Bulk save the individual fixtures."
      condition: "$.get('provider-response-valid', False) and not $.get('provider-errors', []) and len($.get('fixtures', [])) > 0 and len($.get('fixtures', [])) == len($.get('canonical-envelopes', []))"
      config:
        action: "bulk-update"
        embed-selector: "$.get('title')"
        embed-vector: true
        force-update: true
      connector:
        name: "google-genai"
        command: "invoke_embedding"
        model: "text-embedding-004"
        location: "global"
        provider: "vertex_ai"
      document_name: "'sport:Event'"
      documents:
        items: |
          [
            {
              **f,
              'machina_sports_schema': $.get('canonical-envelopes', [])[index].get('machina_sports_schema', {}),
              'metadata': {
                'event_code': str(f.get('@id', '')),
              },
              'title': f.get('name', '')
            }
            for index, f in enumerate($.get('fixtures', []))
          ]
      metadata:
        document_type: "'fixture'"

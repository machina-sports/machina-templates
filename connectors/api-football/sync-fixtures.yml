workflow:

  # api-football-sync-fixtures
  name: "api-football-sync-fixtures"
  title: "API Football - Sync Fixtures"
  description: "Comprehensive workflow to sync fixtures from API Football with support for single/multiple IDs, live fixtures, date ranges, league/team filtering, and venue-specific queries."
  context-variables:
    debugger:
      enabled: true
    api-football:
      x-apisports-key: "$TEMP_CONTEXT_VARIABLE_API_FOOTBALL_API_KEY"
  inputs:
    id: "$.get('id')"
    ids: "$.get('ids')"
    live: "$.get('live')"
    league: "$.get('league')"
    season: "$.get('season')"
    date: "$.get('date')"
    team: "$.get('team')"
    last: "$.get('last')"
    next: "$.get('next')"
    lookback_days: "$.get('lookback_days', 3)"
    lookahead_days: "$.get('lookahead_days', 30)"
    from: "$.get('from') or (datetime.utcnow() - timedelta(days=int($.get('lookback_days', 3)))).strftime(\"%Y-%m-%d\")"
    to: "$.get('to') or (datetime.utcnow() + timedelta(days=int($.get('lookahead_days', 30)))).strftime(\"%Y-%m-%d\")"
    round: "$.get('round')"
    status: "$.get('status')"
    venue: "$.get('venue')"
    timezone: "$.get('timezone')"
    observed_at: "$.get('observed_at', datetime.utcnow().isoformat() + '+00:00')"
  outputs:
    errors: "$.get('provider-errors', [])"
    results: "$.get('provider-results')"
    workflow-status: "'failed' if not $.get('provider-response-valid', False) or $.get('provider-errors', []) or (len($.get('provider-fixtures', [])) > 0 and (not isinstance($.get('fixtures'), list) or len($.get('fixtures', [])) != len($.get('provider-fixtures', [])) or len($.get('canonical-envelopes', [])) != len($.get('provider-fixtures', [])) or len($.get('canonical-envelope-validity', [])) != len($.get('provider-fixtures', [])) or not all($.get('canonical-envelope-validity', [])))) else ('skipped' if len($.get('provider-fixtures', [])) == 0 else 'executed')"
  tasks:

    - type: "connector"
      name: "api-football-get-fixtures"
      description: "Get fixtures from API Football."
      connector:
        name: "api-football"
        command: "get-fixtures"
      inputs:
        id: "$.get('id')"
        ids: "$.get('ids')"
        live: "$.get('live')"
        league: "$.get('league')"
        season: "$.get('season')"
        date: "$.get('date')"
        team: "$.get('team')"
        last: "$.get('last')"
        next: "$.get('next')"
        from: "$.get('from')"
        to: "$.get('to')"
        round: "$.get('round')"
        status: "$.get('status')"
        venue: "$.get('venue')"
        timezone: "$.get('timezone')"
      outputs:
        provider-fixtures: "$.get('response', []) if isinstance($.get('response'), list) else []"
        provider-errors: "{str(key)[:100]: str(value)[:500] for key, value in list($.get('errors', {}).items())[:20]} if isinstance($.get('errors'), dict) else [str(item)[:500] for item in $.get('errors', [])[:20]] if isinstance($.get('errors'), list) else [str($.get('errors'))[:500]] if $.get('errors') else []"
        provider-results: "$.get('results') if isinstance($.get('results'), int) and not isinstance($.get('results'), bool) else None"
        provider-response-valid: "isinstance($.get('response'), list) and isinstance($.get('errors'), (list, dict)) and isinstance($.get('results'), int) and not isinstance($.get('results'), bool) and $.get('results') >= 0 and $.get('results') == len($.get('response'))"

    # canonicalize-fixtures
    - type: connector
      name: canonicalize-fixtures
      description: "Canonicalize each provider fixture and retain its provenance and rights envelope."
      condition: "$.get('provider-response-valid', False) and not $.get('provider-errors', []) and len($.get('provider-fixtures', [])) > 0"
      foreach:
        limit: 1000
        name: provider-fixture
        expr: $
        value: "$.get('provider-fixtures', [])"
      connector:
        name: machina-sports-canonical
        command: canonicalize_event
      inputs:
        provider: "'api-football'"
        consumer_tier: "'prototype'"
        requires: "['event.identity', 'event.competition', 'event.participants', 'event.start_time', 'event.status', 'provenance']"
        optional: "['event.score']"
        observed_at: "$.get('observed_at')"
        payload: "$.get('provider-fixture', {})"
      outputs:
        canonical-envelopes: "[$.get('envelope', {})]"
        canonical-envelope-validity: "[$.get('allowed') is True and isinstance($.get('envelope'), dict) and isinstance($.get('envelope', {}).get('machina_sports_schema'), dict) and $.get('envelope', {}).get('machina_sports_schema', {}).get('schema_version') == 'machina-sports-schema/1' and isinstance($.get('envelope', {}).get('machina_sports_schema', {}).get('event_view'), dict) and isinstance($.get('envelope', {}).get('machina_sports_schema', {}).get('event_view', {}).get('event_id'), str) and bool($.get('envelope', {}).get('machina_sports_schema', {}).get('event_view', {}).get('event_id')) and isinstance($.get('envelope', {}).get('machina_sports_schema', {}).get('event_view', {}).get('label'), str) and bool($.get('envelope', {}).get('machina_sports_schema', {}).get('event_view', {}).get('label')) and $.get('envelope', {}).get('machina_sports_schema', {}).get('event_view', {}).get('provider', {}).get('namespace') == 'api-football' and $.get('envelope', {}).get('machina_sports_schema', {}).get('event_view', {}).get('provider', {}).get('family') == 'licensed' and $.get('envelope', {}).get('machina_sports_schema', {}).get('event_view', {}).get('provider', {}).get('raw') == $.context.get('provider-fixture') and $.get('envelope', {}).get('machina_sports_schema', {}).get('provenance', {}).get('provider', {}).get('namespace') == 'api-football' and $.get('envelope', {}).get('machina_sports_schema', {}).get('provenance', {}).get('provider', {}).get('family') == 'licensed' and $.get('envelope', {}).get('machina_sports_schema', {}).get('provenance', {}).get('observed_at') == $.context.get('observed_at') and $.get('envelope', {}).get('machina_sports_schema', {}).get('rights', {}).get('data_class') == 'licensed-provider-example-fixture' and $.get('envelope', {}).get('machina_sports_schema', {}).get('rights', {}).get('prototype_only') is True and $.get('envelope', {}).get('machina_sports_schema', {}).get('rights', {}).get('commercial_use') is False]"
        fixtures: |
          [
            {
              '@id': block.get('event_view', {}).get('event_id', ''),
              '@type': 'sport:Event',
              'name': block.get('event_view', {}).get('label', ''),
              'event_view': block.get('event_view', {}),
              'machina_sports_schema': block
            }
            for envelope in [$.get('envelope')]
            if isinstance(envelope, dict)
            for block in [envelope.get('machina_sports_schema')]
            if isinstance(block, dict)
          ]

    # task-bulk-save-fixtures
    - type: "document"
      name: "task-bulk-save-fixtures"
      description: "Bulk save the individual fixtures."
      condition: "$.get('provider-response-valid', False) and not $.get('provider-errors', []) and len($.get('provider-fixtures', [])) > 0 and len($.get('fixtures', [])) == len($.get('provider-fixtures', [])) and len($.get('canonical-envelopes', [])) == len($.get('provider-fixtures', [])) and len($.get('canonical-envelope-validity', [])) == len($.get('provider-fixtures', [])) and all($.get('canonical-envelope-validity', []))"
      config:
        action: "bulk-update"
        # Structured events are queried by fields, not semantic similarity.
        # Avoid one embedding call per fixture in this bounded scheduler lane.
        embed-vector: false
        force-update: true
      document_name: "'sport:Event'"
      documents:
        items: |
          [
            {
              **f,
              'metadata': {
                'event_code': str(f.get('@id', '')),
              },
              'title': f.get('name', '')
            }
            for f in $.get('fixtures', [])
          ]
      metadata:
        document_type: "'fixture'"

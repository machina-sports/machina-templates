agent:
  name: api-football-populate
  title: API Football - Populate
  description: |
    Populate agent that syncs fixtures for all configured leagues from API-Football.
  context:
    config-frequency: 360
    status: "inactive"
  # Dual-format scheduling: `jobs:` drives the current jobs-only scheduler
  # (a `type: agent` job self-targets this agent, so the inline workflows
  # chain runs via agent_executor); `config-frequency` remains for older
  # three-lane runtimes, whose legacy lane skips agents that declare jobs[].
  # Activation stays a single switch: the scheduler scans
  # {status: active, jobs.enabled: true}, so flip top-level status only.
  jobs:
    - name: api-football-populate-tick
      enabled: true
      type: agent
      target: api-football-populate
      interval: 21600
  workflows:
  
    # Load leagues configuration
    - name: api-football-load-leagues-config
      description: Load API-Football leagues configuration
      outputs:
        leagues_config: $.get('leagues_config', [])
        enabled_leagues: $.get('enabled_leagues', [])

    # Sync Fixtures for all configured leagues
    - name: api-football-sync-fixtures
      description: Sync fixtures for all enabled API-Football leagues
      foreach:
        name: league
        expr: $
        value: $.get('enabled_leagues', [])
      inputs:
        league: $.get('league').get('league_id')
        season: $.get('league').get('season')
        lookback_days: $.get('league').get('lookback_days')
        lookahead_days: $.get('league').get('lookahead_days')
        timezone: "'UTC'"
      outputs:
        fixtures_sync_status: $.get('workflow-status', 'skipped')

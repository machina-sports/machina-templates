workflow:
  name: "sportradar-nhl-test-credentials"
  title: "Sportradar NHL - Test Credentials"
  description: "Simple workflow to test Sportradar NHL API credentials."
  context-variables:
    debugger:
      enabled: true
    sportradar-nhl:
    # Same key the NFL sync uses. Sportradar issues one key per account whose
    # entitlements span the licensed sports, and sportradar-nfl/sync-games.yml
    # already reads SPORTRADAR_SOCCER_V4_API_KEY, so the "soccer" name is
    # historical, not a scope. Only fall back to a dedicated
    # $TEMP_CONTEXT_VARIABLE_SPORTRADAR_NHL_API_KEY if this one comes back 403
    # for NHL — that would mean the account is not entitled to NHL v7.
      api_key: $TEMP_CONTEXT_VARIABLE_SPORTRADAR_SOCCER_V4_API_KEY
  outputs:
    result: "$.get('games', [])"
    workflow-status: "$.get('workflow-status', 'skipped')"
  tasks:

    - type: connector
      name: sportradar-nhl-test-credentials-task
      description: Test credentials by fetching NHL schedule.
      connector:
        name: sportradar-nhl
        command: get-games/{season_year}/{season_type}/{data_type}
        command_attribute:
          season_year: "'2024'"
          season_type: "'REG'"
          data_type: "'schedule.json'"
      outputs:
        games: "$.get('games', [])"
        workflow-status: "'executed'"
